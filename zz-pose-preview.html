<!doctype html><html><body style="margin:0;background:#222"><canvas id="c" width="1200" height="800"></canvas>
<script type="module">
import * as T from 'three';
import { GLTFLoader } from 'three/examples/jsm/loaders/GLTFLoader.js';
import { Musician } from '/src/features/gig-demo-3d/performers.ts';
import { STAGE_INSTRUMENTS } from '/src/features/gig-demo-3d/instrumentCatalog.ts';
const p = new URLSearchParams(location.search);
const ids = (p.get('ids')||'electric_guitar,acoustic_guitar,bass_guitar,rock_drums').split(',');
const view = p.get('view')||'front';
const r = new T.WebGLRenderer({canvas: document.getElementById('c'), antialias:true});
const scene = new T.Scene(); scene.background=new T.Color('#30343c');
scene.add(new T.HemisphereLight('#fff','#444',2.2)); const d=new T.DirectionalLight('#fff',2); d.position.set(2,4,5); scene.add(d);
const loader=new GLTFLoader();
const models=[]; for (const n of ['casual','female-casual']) models.push((await loader.loadAsync(`/gig-demo-3d/${n}.glb`)).scene);
let x=-(ids.length*2-1)*0.45;
for (const id of ids) for (const m of models) {
  const spec=STAGE_INSTRUMENTS[id]; const a=new Musician(m.clone ? m : m, spec.role,[x,0,0],0,undefined,undefined,id);
  scene.add(a.root); if (a.equipment) scene.add(a.equipment); a.update(2.17,.9,false); x+=0.9;
}
const cam=new T.PerspectiveCamera(30,1.5,.1,50);
const w=ids.length*2*0.9;
if(view==='side'){cam.position.set(w/2+3, 1.3, 0.6); cam.lookAt(0,1.0,0.2);} else {cam.position.set(0,1.3,w*1.15+1.5); cam.lookAt(0,1.0,0);}
r.render(scene,cam); window.done=true;
</script></body></html>
