name: Festival inventory refresh

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Bootstrap parser dependency without project install
        run: |
          archive="$(npm pack typescript@5.8.3 --silent)"
          mkdir -p node_modules
          tar -xzf "$archive" -C node_modules
          mv node_modules/package node_modules/typescript
      - name: Generate Festival inventory
        run: node scripts/festivals/certify-active-system.mjs
      - name: Upload Festival inventory
        uses: actions/upload-artifact@v4
        with:
          name: festival-active-callers
          path: docs/festivals/festival-active-callers.json
          if-no-files-found: error
          retention-days: 1
