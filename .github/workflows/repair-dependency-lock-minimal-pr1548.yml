name: Minimal dependency lock repair for PR 1548

on:
  push:
    branches:
      - agent/fix-skill-practice-booking
    paths:
      - .github/workflows/repair-dependency-lock-minimal-pr1548.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-dependency-lock-minimal-pr1548.yml

permissions:
  contents: write

jobs:
  repair-lock:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/fix-skill-practice-booking')
    runs-on: ubuntu-24.04
    concurrency:
      group: minimal-dependency-lock-repair-pr1548
      cancel-in-progress: true
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-skill-practice-booking
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Use repository npm version
        run: npm install --global npm@10.9.2

      - name: Restore main lockfile and repair integrity-gate registry metadata
        shell: bash
        run: |
          git checkout origin/main -- package-lock.json
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const packages = lock.packages;
          const targets = new Map();

          function addTarget(path, name) {
            const entry = packages[path];
            if (!entry) throw new Error(`Missing lock entry ${path}`);
            if (entry.link || entry.resolved?.startsWith('file:')) return;
            if (!entry.version) throw new Error(`${path} has no version`);
            if (!entry.resolved || !entry.integrity) targets.set(path, name);
          }

          function resolveLockDependency(parentPath, dependency) {
            let cursor = parentPath;
            while (cursor) {
              const nested = `${cursor}/node_modules/${dependency}`;
              if (packages[nested]) return nested;
              const boundary = cursor.lastIndexOf('/node_modules/');
              cursor = boundary < 0 ? '' : cursor.slice(0, boundary);
            }
            const root = `node_modules/${dependency}`;
            return packages[root] ? root : null;
          }

          for (const name of Object.keys({ ...(packageJson.dependencies || {}), ...(packageJson.devDependencies || {}) })) {
            addTarget(`node_modules/${name}`, name);
          }

          for (const name of ['@testing-library/dom', '@testing-library/jest-dom', '@testing-library/react', '@testing-library/user-event']) {
            const parentPath = `node_modules/${name}`;
            addTarget(parentPath, name);
            for (const dependency of Object.keys(packages[parentPath]?.dependencies || {})) {
              const resolvedPath = resolveLockDependency(parentPath, dependency);
              if (!resolvedPath) throw new Error(`${name} dependency ${dependency} has no lock entry`);
              addTarget(resolvedPath, dependency);
            }
          }

          console.log(`Repairing ${targets.size} incomplete registry entries`);
          for (const [path, name] of targets) {
            const entry = packages[path];
            const raw = execFileSync('npm', ['view', `${name}@${entry.version}`, 'dist', '--json'], { encoding: 'utf8' }).trim();
            const dist = JSON.parse(raw);
            if (typeof dist.integrity !== 'string' || !dist.integrity.startsWith('sha512-')) {
              throw new Error(`Invalid registry integrity for ${name}@${entry.version}`);
            }
            if (typeof dist.tarball !== 'string' || !dist.tarball.startsWith('https://')) {
              throw new Error(`Invalid registry tarball for ${name}@${entry.version}`);
            }
            entry.resolved = dist.tarball;
            entry.integrity = dist.integrity;
            console.log(`${path} -> ${name}@${entry.version}`);
          }

          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
          git diff --stat -- package-lock.json

      - name: Verify dependency lock
        run: npm run verify:dependency-lock

      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify dependency tree
        run: npm run verify:dependencies

      - name: Commit minimal lockfile repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Repair dependency lock integrity metadata"
          git push origin HEAD:agent/fix-skill-practice-booking
