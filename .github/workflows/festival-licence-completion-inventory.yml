name: Festival licence completion inventory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install without rewriting stale lockfile
        run: |
          for attempt in 1 2 3; do
            npm install --package-lock=false --ignore-scripts --no-audit --no-fund --legacy-peer-deps && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: Refresh Festival active-system inventory
        run: node scripts/festivals/certify-active-system.mjs
      - name: Commit generated evidence
        run: |
          if git diff --quiet -- docs/festivals/festival-active-callers.json; then
            echo "Festival inventory already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/festivals/festival-active-callers.json
          git commit -m "docs(festivals): refresh licence active callers"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
