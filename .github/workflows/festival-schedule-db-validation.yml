name: Festival schedule DB validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create Festival bridge contract schema
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TYPE public.app_role AS ENUM ('admin', 'user');
          CREATE TYPE public.festival_edition_status AS ENUM (
            'concept','planning','applications_open','booking','announced','on_sale','setup','live','settling','completed','postponed','cancelled','abandoned'
          );

          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE FUNCTION public.current_profile_id_safe() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$ SELECT auth.uid() $$;
          CREATE FUNCTION public.is_admin(uuid) RETURNS boolean
          LANGUAGE sql STABLE
          AS $$ SELECT false $$;

          CREATE TABLE public.profiles(id uuid PRIMARY KEY);
          CREATE TABLE public.companies(id uuid PRIMARY KEY);
          CREATE TABLE public.cities(id uuid PRIMARY KEY, timezone text);

          CREATE TABLE public.festivals(
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            name text NOT NULL,
            city_id uuid NOT NULL REFERENCES public.cities(id),
            start_date date NOT NULL,
            end_date date NOT NULL,
            expected_attendance integer,
            metadata jsonb NOT NULL DEFAULT '{}',
            owner_type text NOT NULL DEFAULT 'system',
            owner_profile_id uuid,
            owner_company_id uuid
          );

          CREATE TABLE public.festival_editions(
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            festival_id uuid NOT NULL REFERENCES public.festivals(id),
            edition_number integer NOT NULL,
            edition_year integer,
            title text,
            city_id uuid REFERENCES public.cities(id),
            start_at timestamptz,
            end_at timestamptz,
            timezone text NOT NULL DEFAULT 'UTC',
            time_zone text NOT NULL DEFAULT 'UTC',
            expected_attendance integer,
            capacity integer,
            status public.festival_edition_status NOT NULL DEFAULT 'planning',
            legacy_metadata jsonb NOT NULL DEFAULT '{}',
            created_by uuid REFERENCES public.profiles(id),
            UNIQUE(festival_id, edition_number)
          );

          CREATE TABLE public.festival_companies(
            id uuid PRIMARY KEY,
            company_id uuid NOT NULL REFERENCES public.companies(id),
            owner_profile_id uuid NOT NULL REFERENCES public.profiles(id),
            public_name text NOT NULL,
            default_city_id uuid REFERENCES public.cities(id)
          );

          CREATE TABLE public.festival_editions_v2(
            id uuid PRIMARY KEY,
            festival_company_id uuid NOT NULL REFERENCES public.festival_companies(id),
            edition_year integer NOT NULL,
            name text NOT NULL,
            status text NOT NULL,
            starts_on date,
            ends_on date,
            city_id uuid REFERENCES public.cities(id),
            expected_capacity integer
          );

          CREATE TABLE public.festival_legacy_mappings(
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            edition_id uuid NOT NULL REFERENCES public.festival_editions(id),
            legacy_source text NOT NULL,
            legacy_id uuid NOT NULL,
            legacy_festival_id uuid,
            created_at timestamptz NOT NULL DEFAULT now(),
            metadata jsonb NOT NULL DEFAULT '{}',
            UNIQUE(legacy_source, legacy_id)
          );

          CREATE TABLE public.festival_public_legacy_bridges(
            legacy_festival_id uuid NOT NULL,
            festival_company_id uuid REFERENCES public.festival_companies(id),
            festival_edition_id uuid REFERENCES public.festival_editions_v2(id),
            provenance text NOT NULL DEFAULT 'admin_repair',
            created_at timestamptz NOT NULL DEFAULT now(),
            PRIMARY KEY(legacy_festival_id, festival_company_id, festival_edition_id)
          );
          SQL
      - name: Apply canonical schedule bridge migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20291218245100_festival_v2_schedule_bridge.sql
      - name: Exercise bridge provisioning, isolation and permissions
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.profiles(id) VALUES
            ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa'),
            ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');
          INSERT INTO public.companies(id) VALUES ('cccccccc-cccc-4ccc-8ccc-cccccccccccc');
          INSERT INTO public.cities(id, timezone) VALUES
            ('dddddddd-dddd-4ddd-8ddd-dddddddddddd', 'Europe/London');
          INSERT INTO public.festival_companies(
            id, company_id, owner_profile_id, public_name, default_city_id
          ) VALUES (
            'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',
            'cccccccc-cccc-4ccc-8ccc-cccccccccccc',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            'Bridge Festival',
            'dddddddd-dddd-4ddd-8ddd-dddddddddddd'
          );
          INSERT INTO public.festival_editions_v2(
            id, festival_company_id, edition_year, name, status,
            starts_on, ends_on, city_id, expected_capacity
          ) VALUES
            (
              '11111111-1111-4111-8111-111111111111',
              'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',
              5, 'Bridge Festival 5', 'draft',
              '2030-06-01', '2030-06-02',
              'dddddddd-dddd-4ddd-8ddd-dddddddddddd', 5000
            ),
            (
              '22222222-2222-4222-8222-222222222222',
              'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',
              6, 'Bridge Festival 6', 'announced',
              '2031-07-03', '2031-07-04',
              'dddddddd-dddd-4ddd-8ddd-dddddddddddd', 7000
            ),
            (
              '33333333-3333-4333-8333-333333333333',
              'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',
              7, 'Incomplete Festival', 'draft',
              NULL, NULL, NULL, NULL
            );

          DO $$
          BEGIN
            IF has_function_privilege('anon', 'public.ensure_festival_v2_schedule_bridge(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'anon must not execute the schedule bridge';
            END IF;
            IF NOT has_function_privilege('authenticated', 'public.ensure_festival_v2_schedule_bridge(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'authenticated role must execute the schedule bridge';
            END IF;
          END
          $$;

          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', false);
          SELECT public.ensure_festival_v2_schedule_bridge('11111111-1111-4111-8111-111111111111');
          SELECT public.ensure_festival_v2_schedule_bridge('11111111-1111-4111-8111-111111111111');
          SELECT public.ensure_festival_v2_schedule_bridge('22222222-2222-4222-8222-222222222222');
          RESET ROLE;

          DO $$
          DECLARE
            first_bridge public.festival_v2_schedule_bridges%ROWTYPE;
            second_bridge public.festival_v2_schedule_bridges%ROWTYPE;
            exact_count integer;
          BEGIN
            SELECT * INTO first_bridge FROM public.festival_v2_schedule_bridges
              WHERE festival_edition_id='11111111-1111-4111-8111-111111111111';
            SELECT * INTO second_bridge FROM public.festival_v2_schedule_bridges
              WHERE festival_edition_id='22222222-2222-4222-8222-222222222222';
            IF first_bridge.schedule_edition_id IS NULL OR second_bridge.schedule_edition_id IS NULL THEN
              RAISE EXCEPTION 'schedule bridges were not provisioned';
            END IF;
            IF first_bridge.schedule_festival_id = second_bridge.schedule_festival_id
               OR first_bridge.schedule_edition_id = second_bridge.schedule_edition_id THEN
              RAISE EXCEPTION 'annual editions must use isolated schedule aggregates';
            END IF;
            IF (SELECT count(*) FROM public.festival_v2_schedule_bridges) <> 2
               OR (SELECT count(*) FROM public.festivals) <> 2
               OR (SELECT count(*) FROM public.festival_editions) <> 2 THEN
              RAISE EXCEPTION 'bridge provisioning was not idempotent';
            END IF;
            IF (SELECT time_zone FROM public.festival_editions WHERE id=first_bridge.schedule_edition_id) <> 'Europe/London' THEN
              RAISE EXCEPTION 'Festival timezone was not preserved';
            END IF;
            IF (SELECT status FROM public.festival_editions WHERE id=second_bridge.schedule_edition_id) <> 'announced' THEN
              RAISE EXCEPTION 'Festival lifecycle projection was not preserved';
            END IF;
            SELECT count(DISTINCT mapping.edition_id) INTO exact_count
            FROM public.festival_public_legacy_bridges bridge
            JOIN public.festival_legacy_mappings mapping
              ON mapping.legacy_id=bridge.legacy_festival_id
              OR mapping.legacy_festival_id=bridge.legacy_festival_id
            WHERE bridge.festival_edition_id='11111111-1111-4111-8111-111111111111';
            IF exact_count <> 1 THEN
              RAISE EXCEPTION 'runtime compatibility join was not edition-exact';
            END IF;
          END
          $$;

          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', false);
          DO $$
          BEGIN
            PERFORM public.ensure_festival_v2_schedule_bridge('11111111-1111-4111-8111-111111111111');
            RAISE EXCEPTION 'non-owner bridge access unexpectedly succeeded';
          EXCEPTION WHEN SQLSTATE 'P0001' THEN
            IF SQLERRM <> 'FESTIVAL_SCHEDULE_ACCESS_DENIED' THEN RAISE; END IF;
          END
          $$;

          SELECT set_config('request.jwt.claim.sub', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', false);
          DO $$
          BEGIN
            PERFORM public.ensure_festival_v2_schedule_bridge('33333333-3333-4333-8333-333333333333');
            RAISE EXCEPTION 'incomplete edition unexpectedly created a schedule bridge';
          EXCEPTION WHEN SQLSTATE 'P0001' THEN
            IF SQLERRM <> 'FESTIVAL_SCHEDULE_SETUP_INCOMPLETE' THEN RAISE; END IF;
          END
          $$;
          RESET ROLE;
          SQL
