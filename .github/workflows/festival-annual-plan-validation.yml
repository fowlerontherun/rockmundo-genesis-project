name: Festival annual plan validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install without rewriting stale lockfile
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Lint annual Festival sources
        run: >-
          npx eslint
          src/features/festivals/annual-plan/FestivalAnnualPlan.tsx
          src/features/festivals/annual-plan/model.ts
          src/features/festivals/annual-plan/model.test.ts
          src/features/festivals/annual-plan/repository.ts
          src/features/festivals/annual-plan/migration.test.ts
          src/features/festivals/editions/FestivalCompanyEditionsPage.tsx
          src/features/festivals/editions/repository.ts
          src/features/festivals/editions/repository.test.ts
          src/features/festivals/ui/FestivalEditionSections.tsx
          src/features/festivals/ui/simplifiedFestivalOwnerFlow.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Run focused annual Festival tests
        run: >-
          npx vitest run
          src/features/festivals/annual-plan/model.test.ts
          src/features/festivals/annual-plan/migration.test.ts
          src/features/festivals/editions/repository.test.ts
          src/features/festivals/ui/simplifiedFestivalOwnerFlow.test.ts
          --pool=forks --maxWorkers=1 --minWorkers=1
      - name: Verify Festival routes
        run: npm run test:festivals:routes && npm run test:festivals:route-components
      - name: Verify Festival active-system inventory
        run: npm run test:festivals:active-callers
      - name: Verify migration timestamps
        run: npm run verify:migration-timestamps
      - name: Build production app
        run: npm run build
