name: Halloween 2026 Regression Gate

on:
  pull_request:
    paths:
      - 'src/features/seasonal/**'
      - 'src/pages/admin/SystemStatus.tsx'
      - 'src/pages/admin/HalloweenLaunchPreflight.test.ts'
      - 'src/features/player-model/**'
      - 'src/features/clothing-preview/**'
      - 'src/features/gig-demo-3d/performers.ts'
      - 'src/hooks/useSkinStore.ts'
      - 'src/features/gig-experience/services/**'
      - 'src/features/gig-experience/events/**'
      - 'src/features/gig-experience/viewer/three/**'
      - 'supabase/functions/generate-gig-viewer-replay/**'
      - 'supabase/migrations/20261016111000_gig_immutable_stage_costume_snapshots.sql'
      - 'src/components/gig/**'
      - 'supabase/functions/complete-gig/**'
      - 'supabase/migrations/20261016*halloween*'
      - 'supabase/tests/halloween_2026_rewards.sql'
      - '.github/workflows/halloween-2026-regression.yml'
  workflow_dispatch:

jobs:
  halloween:
    name: Halloween targeted unit and type tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Pin npm
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Targeted Halloween unit and integration contracts
        run: |
          npx vitest run \
            src/features/seasonal/halloween2026.test.ts \
            src/features/seasonal/HalloweenEventNotice.test.tsx \
            src/pages/admin/HalloweenLaunchPreflight.test.ts \
            src/components/gig/HalloweenGigRewardSummary.test.tsx \
            src/features/player-model/accessories.test.ts \
            src/features/player-model/PlayerModelEditor.test.tsx \
            src/features/player-model/luthieryLoadRecovery.test.ts \
            src/features/player-model/equippedWardrobeSource.test.ts \
            src/features/clothing-preview/curatedGarmentAssets.test.ts \
            src/features/clothing-preview/equippedAvatarHeadwear.test.ts \
            src/features/clothing-preview/pumpkinHatV1Routing.test.ts \
            src/features/gig-experience/services/replayStageVisuals.test.ts \
            src/features/gig-experience/viewer/three/GigStage3D.test.tsx \
            supabase/functions/generate-gig-viewer-replay/gig-stage-visual-snapshot.integration.test.ts \
            supabase/functions/complete-gig/halloween-2026.integration.test.ts \
            supabase/functions/complete-gig/clothing-performance.integration.test.ts \
            --reporter=default
      - name: Check new Halloween UI lint
        run: npx eslint src/features/seasonal/HalloweenEventNotice.test.tsx src/components/gig/HalloweenGigRewardSummary.tsx src/components/gig/HalloweenGigRewardSummary.test.tsx src/features/clothing-preview/curatedGarmentAssets.ts src/features/clothing-preview/curatedGarmentAssets.test.ts src/features/clothing-preview/RichClothingPreview.tsx src/features/clothing-preview/browserPreviewRenderer.ts src/features/gig-demo-3d/performers.ts
