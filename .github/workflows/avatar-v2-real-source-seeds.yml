name: Avatar V2 real source authoring packs

# Actual downloadable CC0 scenes and visual proof, not production assets.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/avatar-v2/**'
      - '.github/workflows/avatar-v2-real-source-seeds.yml'
      - 'avatar-v2-browser-smoke.html'
      - 'playwright.avatar-v2.config.ts'
      - 'tests/avatar-v2/**'
  pull_request:
    paths:
      - 'public/avatar-v2/**'
      - 'scripts/avatar-v2/**'
      - 'scripts/avatar-v2/blender/rockmundo_avatar_v2_build_seed_artifacts.py'
      - 'scripts/avatar-v2/verify_source_artifacts.py'
      - 'scripts/avatar-v2/source_rig_suggestions.py'
      - 'scripts/avatar-v2/head_motion_weights.py'
      - 'scripts/avatar-v2/blender/rockmundo_avatar_v2_head_motion_proof.py'
      - 'scripts/avatar-v2/tests/test_head_motion_weights.py'
      - 'scripts/avatar-v2/blender/rockmundo_avatar_v2_source_joint_suggestions.py'
      - 'scripts/avatar-v2/tests/test_source_rig_suggestions.py'
      - 'scripts/avatar-v2/publish_reference_previews.py'
      - 'scripts/avatar-v2/tests/test_publish_reference_previews.py'
      - 'scripts/avatar-v2/tests/test_verify_source_artifacts.py'
      - 'scripts/avatar-v2/eye_lookdev.py'
      - 'scripts/avatar-v2/tests/test_eye_lookdev.py'
      - 'scripts/avatar-v2/blender/rockmundo_avatar_v2_source_lookdev.py'
      - 'scripts/avatar-v2/facial_fibres.py'
      - 'scripts/avatar-v2/blender/rockmundo_avatar_v2_face_fibres.py'
      - 'scripts/avatar-v2/lip_lookdev.py'
      - 'scripts/avatar-v2/blender/rockmundo_avatar_v2_lips.py'
      - 'scripts/avatar-v2/tests/test_lip_lookdev.py'
      - 'scripts/avatar-v2/tests/test_facial_fibres.py'
      - '.github/workflows/avatar-v2-real-source-seeds.yml'
      - 'avatar-v2-browser-smoke.html'
      - 'playwright.avatar-v2.config.ts'
      - 'tests/avatar-v2/**'

permissions:
  contents: write

# Avoid competing runs updating the same generated proof-only branch.
concurrency:
  group: avatar-v2-source-proofs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-authoring-packs:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      BLENDER_VERSION: '4.3.2'
      SOURCE_ROOT: work/avatar-v2-source
      ARTIFACT_ROOT: work/avatar-v2-authoring-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify immutable CC0 source provenance
        run: node scripts/avatar-v2/verify-source-provenance.mjs
      - name: Test artifact integrity and fail-closed release labels
        run: python3 -m unittest discover -s scripts/avatar-v2/tests -p test_verify_source_artifacts.py -v
      - name: Test real sclera/iris/pupil classification and separate curved cornea geometry
        run: python3 -m unittest discover -s scripts/avatar-v2/tests -p test_eye_lookdev.py -v
      - name: Test real skin-fitted eyebrows and upper-lash tube geometry
        run: python3 -m unittest discover -s scripts/avatar-v2/tests -p test_facial_fibres.py -v
      - name: Test genuine source upper/lower lip sculpt materials
        run: python3 -m unittest discover -s scripts/avatar-v2/tests -p test_lip_lookdev.py -v
      - name: Test preliminary, non-certified real head/neck/eye skinning
        run: python3 -m unittest discover -s scripts/avatar-v2/tests -p test_head_motion_weights.py -v
      - name: Test garment GLB skinning gate
        run: python3 -m unittest discover -s scripts/avatar-v2/tests -p test_verify_skinned_glb.py -v
      - name: Test reference gallery publication safety
        run: python3 -m unittest discover -s scripts/avatar-v2/tests -p test_publish_reference_previews.py -v
      - name: Test actual eyeball and lateral-head joint guide measurements
        run: python3 -m unittest discover -s scripts/avatar-v2/tests -p test_source_rig_suggestions.py -v
      - name: Fetch pinned official Blender Human Base Meshes 1.4.1
        run: python3 scripts/avatar-v2/fetch_human_base_meshes.py --output-dir "$SOURCE_ROOT"
      - name: Install pinned Blender and verify official checksum
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libxi6 libxrender1 libxkbcommon0
          cd "$RUNNER_TEMP"
          BASE="https://download.blender.org/release/Blender4.3"
          FILE="blender-$BLENDER_VERSION-linux-x64.tar.xz"
          curl --fail --location --retry 3 --silent --show-error "$BASE/$FILE" -o "$FILE"
          curl --fail --location --retry 3 --silent --show-error "$BASE/blender-$BLENDER_VERSION.sha256" -o blender.sha256
          grep -F " $FILE" blender.sha256 | sha256sum --check --status
          tar -xf "$FILE"
          BLENDER="$RUNNER_TEMP/blender-$BLENDER_VERSION-linux-x64/blender"
          "$BLENDER" --background --version
          echo "BLENDER_BIN=$BLENDER" >> "$GITHUB_ENV"
      - name: Build real masculine and feminine source plus improved eye/skin lookdev comparisons
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" \
            "$BLENDER_BIN" --background --factory-startup --threads 4 --python \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_build_seed_artifacts.py -- \
            --source-root "$SOURCE_ROOT" --output-root "$ARTIFACT_ROOT"
      - name: Verify geometry, both complete packs and SHA-256 integrity
        run: python3 scripts/avatar-v2/verify_source_artifacts.py --root "$ARTIFACT_ROOT"
      - name: Prove Phase 1 refuses BOTH real unfitted source rigs
        shell: bash
        run: |
          set -euo pipefail
          for FRAME in masculine feminine; do
            xvfb-run -a -s "-screen 0 1920x1080x24" \
              "$BLENDER_BIN" --background \
              "$ARTIFACT_ROOT/$FRAME/$FRAME-unfitted-rig-guide.blend" \
              --python scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_source_smoke.py -- \
              --frame "$FRAME"
          done
      # This is a diagnostic, NOT a production gate: artist joint fitting
      # must be completed before claiming actual usable full-body skinning.
      - name: Probe real full-body initial weights and deformation on both UNFITTED CC0 guides
        id: phase1_probe
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          FAILED=0
          for FRAME in masculine feminine; do
            xvfb-run -a -s "-screen 0 1920x1080x24" \
              "$BLENDER_BIN" --background \
              "$ARTIFACT_ROOT/$FRAME/$FRAME-unfitted-rig-guide.blend" \
              --python scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_autobind_probe.py -- \
              --frame "$FRAME" --output-root work/avatar-v2-phase1-probes || FAILED=1
          done
          exit "$FAILED"
      # The actual same-run CC0 paint misses and real guide are overlaid
      # beside unchanged editable joint handles in a distinct diagnostic scene.
      # The nearest SOURCE vertex is NOT an internal joint and may be a wrong digit.
      - name: Package actual CC0 finger surface warnings with editable fit handles
        shell: bash
        continue-on-error: true
        run: |
          set -euo pipefail
          python3 -m unittest discover -s scripts/avatar-v2/tests -p test_phase1_finger_handoff.py -v
          for FRAME in masculine feminine; do
            xvfb-run -a -s "-screen 0 1920x1080x24" \
              "$BLENDER_BIN" --background \
              "$ARTIFACT_ROOT/$FRAME/$FRAME-joint-handles.blend" \
              --python scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_finger_handoff.py -- \
              --frame "$FRAME" \
              --probe-report "work/avatar-v2-phase1-probes/$FRAME/$FRAME-AUTOBIND-EXPERIMENT-report.json" \
              --output "work/avatar-v2-phase1-probes/$FRAME/$FRAME-FINGER-REVIEW-HANDLES-UNAPPROVED.blend"
          done
      # Strict separate UNFITTED source-copy experiment. Only genuine, actual
      # mesh-edge-connected same-digit parent vertices are eligible. Do NOT
      # paint the original experimental scene, editable fit-handle guides or
      # public/avatar-v2, and do not count trial weights as artist approval.
      - name: Test real safe same-digit finger skin trial on both isolated CC0 copies
        id: phase1_same_digit_trial
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          FAILED=0
          python3 -m unittest discover -s scripts/avatar-v2/tests -p test_phase1_finger_trial.py -v || FAILED=1
          for FRAME in masculine feminine; do
            xvfb-run -a -s "-screen 0 1920x1080x24" \
              "$BLENDER_BIN" --background \
              "work/avatar-v2-phase1-probes/$FRAME/$FRAME-AUTOBIND-EXPERIMENT-not-validated.blend" \
              --python scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_same_digit_trial.py -- \
              --frame "$FRAME" \
              --probe-report "work/avatar-v2-phase1-probes/$FRAME/$FRAME-AUTOBIND-EXPERIMENT-report.json" \
              --output-root "work/avatar-v2-phase1-probes" || FAILED=1
          done
          exit "$FAILED"
      - name: Upload private experimental body skinning diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-v2-phase1-UNFITTED-diagnostics
          path: work/avatar-v2-phase1-probes/**
          if-no-files-found: warn
          retention-days: 14
          compression-level: 6
      - name: Verify actual Blender-exported GLB binary skin weights for both source experiments
        run: |
          python3 scripts/avatar-v2/verify_glb_binary.py \
            "$ARTIFACT_ROOT"/masculine/*-HEAD-RIG-EXPERIMENT-not-validated.glb \
            "$ARTIFACT_ROOT"/feminine/*-HEAD-RIG-EXPERIMENT-not-validated.glb
      # Use genuine exported artifacts from this exact run, not mocks or
      # captured Blender PNGs, to verify the browser's WebGL GLTFLoader on
      # desktop and mobile. The viewer is a CI-only page; no live promotion.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked browser-test dependencies
        run: |
          npm install --global npm@10.9.2
          npm ci
          npx playwright install --with-deps chromium
      - name: Browser-render actual masculine and feminine GLBs on desktop and mobile
        env:
          CI: 'true'
        run: npm run test:avatar-v2:browser-proof
      - name: Upload browser-rendered GLB proof screenshots and render diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: avatar-v2-real-browser-source-only
          path: |
            work/avatar-v2-browser-proofs/**
            work/avatar-v2-playwright-results/**
            work/avatar-v2-playwright-report/**
          if-no-files-found: warn
          retention-days: 14

      - name: Upload real masculine authoring scene, rig handles and visual proofs
        uses: actions/upload-artifact@v4
        with:
          name: avatar-v2-masculine-CC0-authoring-only
          path: |
            work/avatar-v2-authoring-artifacts/masculine/**
            work/avatar-v2-authoring-artifacts/authoring-artifacts-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
      - name: Upload real feminine authoring scene, rig handles and visual proofs
        uses: actions/upload-artifact@v4
        with:
          name: avatar-v2-feminine-CC0-authoring-only
          path: |
            work/avatar-v2-authoring-artifacts/feminine/**
            work/avatar-v2-authoring-artifacts/authoring-artifacts-manifest.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 6

      # This branch holds only generated source reference PNGs and source-only
      # GLBs, not artist .blend files or any public/avatar-v2 production assets.
      # PRs never publish; only trusted main pushes/manual main builds can.
      - name: Package verified in-game reference proofs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          python3 scripts/avatar-v2/publish_reference_previews.py \
            --root "$ARTIFACT_ROOT" \
            --output "$RUNNER_TEMP/avatar-v2-reference-previews"
      - name: Publish source-only proof gallery branch
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/avatar-v2-reference-previews"
          git init -b avatar-v2-reference-previews
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview-manifest.json masculine feminine
          git commit -m "Publish verified Avatar V2 source-only visual previews"
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force origin HEAD:refs/heads/avatar-v2-reference-previews
