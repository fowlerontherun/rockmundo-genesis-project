name: Festival schedule compatibility edit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply schedule compatibility edits
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workspace = Path("src/features/festivals/scheduling/components/FestivalScheduleWorkspace.tsx")
          source = workspace.read_text()
          source = source.replace(".toSorted(", ".sort(")
          import_line = 'import { festivalScheduleLoadErrorMessage } from "../errors";\n'
          anchor = 'import {\n  useFestivalScheduleWorkspace,\n  useScheduleMutations,\n} from "../hooks";\n'
          if import_line not in source:
              source = source.replace(anchor, anchor + import_line)
          source = source.replace(
              '          Schedule workspace could not be loaded.\n',
              '          {festivalScheduleLoadErrorMessage(query.error)}\n',
          )
          source = source.replace(
              'Add a stage before building the Festival schedule.',
              'Complete site planning for this annual edition before building its schedule.',
          )
          workspace.write_text(source)

          for path in [
              Path("src/features/festivals/scheduling/service.ts"),
              Path("src/features/festivals/scheduling/service.test.ts"),
          ]:
              text = path.read_text().replace(
                  "ensure_festival_v2_schedule_bridge",
                  "ensure_festival_v2_schedule_workspace",
              )
              path.write_text(text)
          PY
          files=(
            src/features/festivals/scheduling/components/FestivalScheduleWorkspace.tsx
            src/features/festivals/scheduling/service.ts
            src/features/festivals/scheduling/service.test.ts
          )
          if git diff --quiet -- "${files[@]}"; then
            echo "Compatibility edits already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Show actionable festival schedule setup failures"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
