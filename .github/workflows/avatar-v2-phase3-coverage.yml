name: Avatar V2 Phase 3 garment coverage

on:
  pull_request:
    paths:
      - 'public/avatar-v2/clothing/**'
      - 'scripts/avatar-v2/audit-phase3-garments.mjs'
      - 'scripts/avatar-v2/validate-garments.mjs'
      - '.github/workflows/avatar-v2-phase3-coverage.yml'
  push:
    branches: [main]
    paths:
      - 'public/avatar-v2/clothing/**'
      - 'scripts/avatar-v2/audit-phase3-garments.mjs'
      - 'scripts/avatar-v2/validate-garments.mjs'
      - '.github/workflows/avatar-v2-phase3-coverage.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  garment-authoring-gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate all present garment GLBs and manifest entries
        run: node scripts/avatar-v2/validate-garments.mjs
      - name: Report all missing Phase 3 production deliverables
        run: node scripts/avatar-v2/audit-phase3-garments.mjs
      - name: Explain release gate
        run: |
          echo 'The audit above reports staged/unfinished garments without passing them as production assets.'
          echo 'Release certification requires: node scripts/avatar-v2/audit-phase3-garments.mjs --strict'
          echo 'Strict certification is intentionally not enabled until approved fitted body rigs and all 15 garment exports exist.'
