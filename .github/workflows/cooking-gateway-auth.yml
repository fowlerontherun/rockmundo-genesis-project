name: Cooking Gateway Authentication Contract

on:
  pull_request:
    paths:
      - 'supabase/functions/cooking-session/**'
      - 'src/features/cooking/**'
      - 'tests/cooking-staging/**'
      - '.github/workflows/cooking-gateway-auth.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/cooking-session/**'
      - 'src/features/cooking/**'
      - 'tests/cooking-staging/**'
      - '.github/workflows/cooking-gateway-auth.yml'

jobs:
  cooking-gateway-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Use repository npm
        run: npm install --global npm@10.9.2
      - name: Install pinned dependencies
        run: npm ci
      - name: Validate cooking gateway contract and UI
        run: npm run test:cooking
      - name: Typecheck
        run: npm run typecheck
      - name: Parse opt-in staging Playwright contracts (no browser or network)
        # These .invalid hosts and throwaway credentials are deliberately not
        # usable. --list compiles/discovers specifications without executing
        # tests, launching browsers, spending game cash or calling a server.
        env:
          COOKING_STAGING_BASE_URL: https://cooking-staging-tests.invalid
          COOKING_STAGING_SUPABASE_URL: https://cooking-staging-api.invalid
          COOKING_STAGING_EMAIL: unused@example.invalid
          COOKING_STAGING_PASSWORD: never-used
          COOKING_STAGING_ALLOW_WRITES: YES_STAGING_ONLY
        shell: bash
        run: |
          set -euo pipefail
          npx playwright test --config=playwright.cooking.staging.config.ts --list | tee /tmp/cooking-staging-test-list.txt
          grep -q 'concurrent seller cancellation settle food escrow exactly once' /tmp/cooking-staging-test-list.txt
