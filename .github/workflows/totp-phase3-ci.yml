name: TOTP Phase 3 release gate

on:
  pull_request:
    paths:
      - "src/features/top-of-the-pops/**"
      - "src/pages/admin/TopOfThePops*.tsx"
      - "src/pages/__tests__/topOfThePops.pages.test.tsx"
      - "src/renderers/**"
      - "tests/totp/**"
      - "workers/totp-render-worker/**"
      - "scripts/totp/**"
      - "supabase/tests/totp_*.sql"
      - "supabase/migrations/**"
      - ".github/workflows/totp-*.yml"
      - "totp-render.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase3:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Verify TOTP migration timestamps
        run: npm run verify:totp-migration-timestamps

      - name: Typecheck
        run: npm run typecheck

      - name: Phase 3 unit and failure-recovery suite
        run: npm run test:totp:phase3

      - name: Production build
        env:
          VITE_SUPABASE_URL: "https://yztogmdixmchsmimtent.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJIUzI1NiIsInJlZiI6Inl6dG9nbWRpeG1jaHNtaW10ZW50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5ODU0ODcsImV4cCI6MjA3MzU2MTQ4N30.vqfz_ZIvCIEXAuoSYmydg-XA6oUiPbcCc6yjfb2zL0g"
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start deterministic render page
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/totp-phase3-vite.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/totp-render.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/totp-phase3-vite.log
          exit 1

      - name: Browser and visual render smoke
        env:
          PLAYWRIGHT_REUSE_EXISTING_SERVER: "1"
        run: npm run test:totp:render-smoke

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.31.8

      - name: Phase 3 database lifecycle and release gates
        run: npm run test:totp:db

      - name: Upload renderer logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: totp-phase3-logs
          path: /tmp/totp-phase3-vite.log
          if-no-files-found: ignore
