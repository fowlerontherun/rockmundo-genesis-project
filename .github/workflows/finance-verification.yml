name: Finance verification

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'src/**'
      - 'tests/finance/**'
      - 'scripts/finance/**'
      - 'docs/finance/**'
      - 'playwright.finance.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/finance-verification.yml'
  workflow_dispatch:

jobs:
  finance-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_STARTED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: supabase/setup-cli@v1
        with:
          version: 2.31.8
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Print frontend tool versions
        run: |
          node --version
          npm --version
          supabase --version
      - name: Verify dependency lock
        run: npm run verify:dependency-lock
      - name: Install dependencies
        run: npm ci
      - name: Verify dependency tree
        run: npm run verify:dependencies
      - name: Verify Finance release-gate contract
        run: npm run test:finance:contract
      - name: Verify Docker
        run: |
          command -v docker
          docker info
      - name: Start local Supabase stack
        run: |
          set -o pipefail
          mkdir -p finance-verification-diagnostics
          supabase stop --no-backup || true

          # setup-cli sets the GHCR-only override, which cannot fall back if
          # GitHub-hosted runners hit a shared-IP GHCR rate limit. Keep the
          # pinned CLI and image tags, but try official Supabase registries.
          for registry in public.ecr.aws ghcr.io docker.io; do
            attempt_log="finance-verification-diagnostics/supabase-start-${registry//./-}.log"
            echo "Trying official Supabase registry: $registry"
            if SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry" supabase start --debug 2>&1 | tee "$attempt_log"; then
              echo "SUPABASE_STARTED=true" >> "$GITHUB_ENV"
              exit 0
            fi

            # Retry only registry rate limiting; never mask a migration,
            # startup, configuration, or SQL failure by switching registries.
            if ! grep -Eqi 'toomanyrequests|429.*(Too Many Requests|Rate exceeded)' "$attempt_log"; then
              echo "Supabase failed for a non-registry reason; stopping." >&2
              supabase stop --no-backup || true
              exit 1
            fi

            echo "Registry $registry throttled; cleaning up before fallback." >&2
            supabase stop --no-backup || true
          done

          echo "All official Supabase registries failed to start the stack." >&2
          exit 1
      - name: Export local database URL
        run: |
          DB_URL="$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '"')"
          test -n "$DB_URL"
          echo "SUPABASE_DB_URL=$DB_URL" >> "$GITHUB_ENV"
      - name: Reset migrated test database
        run: |
          set -o pipefail
          supabase db reset 2>&1 | tee finance-verification-diagnostics/migration-reset.log
      - name: Lint database
        run: supabase db lint
      - name: Run database tests
        run: supabase test db
      - name: Run finance reconciliation gate
        run: npm run test:finance:db
      - name: Verify generated Supabase types
        run: |
          supabase gen types typescript --local > /tmp/supabase-types.ts
          diff -u src/integrations/supabase/types.ts /tmp/supabase-types.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint:ci
      - name: Unit tests
        run: npm run test -- --run
      - name: Build
        run: npm run build
      - name: Finance browser gate
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e:finance
      - name: Upload Finance verification diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: finance-verification-diagnostics
          path: |
            finance-verification-diagnostics/**
            playwright-report-finance/**
            test-results/finance/**
          if-no-files-found: ignore
      - name: Stop local Supabase stack
        if: always() && env.SUPABASE_STARTED == 'true'
        run: supabase stop --no-backup || true
