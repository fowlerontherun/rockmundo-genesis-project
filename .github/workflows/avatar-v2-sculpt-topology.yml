name: Avatar V2 sculpt topology

on:
  pull_request:
    paths:
      - 'scripts/avatar-v2/**'
      - 'public/avatar-v2/README.md'
      - 'docs/avatar-v2-mesh-system.md'
      - '.github/workflows/avatar-v2-sculpt-topology.yml'
  push:
    paths:
      - 'scripts/avatar-v2/**'
      - '.github/workflows/avatar-v2-sculpt-topology.yml'

jobs:
  face-landmark-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Blender authoring modules
        run: |
          python -m py_compile \
            scripts/avatar-v2/facial_topology.py \
            scripts/avatar-v2/verify_source_artifacts.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_build_seed_artifacts.py \
            scripts/avatar-v2/rig_landmarks.py \
            scripts/avatar-v2/eye_lookdev.py \
            scripts/avatar-v2/facial_fibres.py \
            scripts/avatar-v2/lip_lookdev.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_lips.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_face_fibres.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_source_lookdev.py \
            scripts/avatar-v2/lod_surface_transfer.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_retarget_lod.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_fit_rig.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_topology_audit.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_export.py
      - name: Test genuine sculpt landmark geometry rules
        run: python -m unittest discover -s scripts/avatar-v2/tests -p test_facial_topology.py -v
      - name: Test artist joint marker fitting and topology-safe rig edits
        run: python -m unittest discover -s scripts/avatar-v2/tests -p test_rig_landmarks.py -v
      - name: Test genuine retopology morph and skin weight transfer
        run: python -m unittest discover -s scripts/avatar-v2/tests -p test_lod_surface_transfer.py -v
      - name: Test real-source artifact integrity and fail-closed release labels
        run: python -m unittest discover -s scripts/avatar-v2/tests -p test_verify_source_artifacts.py -v
      - name: Test real source eye geometry and curved corneas
        run: python -m unittest discover -s scripts/avatar-v2/tests -p test_eye_lookdev.py -v
      - name: Test physical source-projected eyebrow and eyelash geometry
        run: python -m unittest discover -s scripts/avatar-v2/tests -p test_facial_fibres.py -v
      - name: Test genuine unmodified upper/lower lip sculpt tint geometry
        run: python -m unittest discover -s scripts/avatar-v2/tests -p test_lip_lookdev.py -v
      - name: Check audited export provenance and stale-GLB regression
        run: node --test scripts/avatar-v2/tests/face-topology-provenance.test.mjs
