name: Avatar V2 Phase 0 integrity gate

# Independent, actionable asset-validation result even when unrelated product
# tests or a local Supabase container are broken in the general CI workflow.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/avatar-v2/**'
      - 'public/avatar-v2/**'
      - 'src/features/player-model/v2/**'
      - 'src/components/admin/avatar/**'
      - 'docs/avatar-v2-phase0-evidence.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/avatar-v2-phase0.yml'
  pull_request:
    paths:
      - 'scripts/avatar-v2/**'
      - 'public/avatar-v2/**'
      - 'src/features/player-model/v2/**'
      - 'src/components/admin/avatar/**'
      - 'docs/avatar-v2-phase0-evidence.md'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/avatar-v2-phase0.yml'

permissions:
  contents: read

concurrency:
  group: avatar-v2-phase0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asset-integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Install locked dependencies
        run: npm ci
      - name: Check Avatar V2 Blender helper syntax
        run: npm run verify:avatar-v2-blender-scripts
      - name: Test actual GLB BIN, skin and QA-evidence rejection cases
        run: npm run test:avatar-v2:python
      - name: Enforce V2 source, body and garment production boundaries
        run: npm run validate:avatar-v2
      - name: Regression-test runtime V2 preview, clothing and fallback
        run: npm run test:avatar-v2
      - name: Verify TypeScript integration
        run: npm run typecheck
      - name: Verify release-focused lint baseline
        run: npm run lint:ci
      - name: Record artifact-gate result
        if: success()
        run: |
          {
            echo '## Avatar V2 Phase 0 integrity gate'
            echo 'GLB binary validation, production manifest quarantine, approval evidence, V2 regression tests, TypeScript and lint passed.'
            echo 'This is automated integrity proof, **not** Blender artist approval or authenticated mobile/desktop admin-preview sign-off.'
          } >> "$GITHUB_STEP_SUMMARY"
