name: Festival simplification inventory

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Bootstrap parser dependency without project install
        run: |
          archive="$(npm pack typescript@5.8.3 --silent)"
          mkdir -p node_modules
          tar -xzf "$archive" -C node_modules
          mv node_modules/package node_modules/typescript
      - name: Generate Festival active-system inventory
        run: node scripts/festivals/certify-active-system.mjs
      - name: Commit refreshed inventory
        run: |
          if git diff --quiet -- docs/festivals/festival-active-callers.json; then
            echo "Festival inventory is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/festivals/festival-active-callers.json
          git commit -m "Refresh simplified Festival certification inventory"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
