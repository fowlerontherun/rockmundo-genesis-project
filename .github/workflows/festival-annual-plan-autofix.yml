name: Festival annual plan edit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Keep annual plan component hook-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("src/features/festivals/annual-plan/FestivalAnnualPlan.tsx")
          source = path.read_text()
          source = source.replace(
              'import { useEffect, useMemo, useRef, useState } from "react";',
              'import { useEffect, useRef, useState } from "react";',
          )
          old = '''  const localPreview = useMemo(() => {
            if (!selectedScale) return null;
            return {
              capacityRange: `${selectedScale.minimumCapacity.toLocaleString("en-GB")}–${selectedScale.maximumCapacity.toLocaleString("en-GB")}`,
              maximumDuration: selectedScale.maximumDurationDays,
              demandEffect: selectedMarketing
                ? Math.round((selectedMarketing.demandBasisPoints - 10000) / 100)
                : 0,
              costEffect: selectedMarketing
                ? Math.round((selectedMarketing.costBasisPoints - 10000) / 100)
                : 0,
            };
          }, [selectedMarketing, selectedScale]);'''
          new = '''  const localPreview = selectedScale
            ? {
                capacityRange: `${selectedScale.minimumCapacity.toLocaleString("en-GB")}–${selectedScale.maximumCapacity.toLocaleString("en-GB")}`,
                demandEffect: selectedMarketing
                  ? Math.round((selectedMarketing.demandBasisPoints - 10000) / 100)
                  : 0,
              }
            : null;'''
          if old not in source:
              raise SystemExit("annual plan preview block not found")
          path.write_text(source.replace(old, new))
          PY
          if git diff --quiet -- src/features/festivals/annual-plan/FestivalAnnualPlan.tsx; then
            echo "Annual plan component already hook-safe."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/festivals/annual-plan/FestivalAnnualPlan.tsx
          git commit -m "Keep annual Festival plan component hook-safe"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
