name: Festival annual plan edit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Keep annual plan component hook-safe
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          path = Path("src/features/festivals/annual-plan/FestivalAnnualPlan.tsx")
          source = path.read_text()
          source = source.replace(
              'import { useEffect, useMemo, useRef, useState } from "react";',
              'import { useEffect, useRef, useState } from "react";',
          )
          pattern = re.compile(
              r"  const localPreview = useMemo\(\(\) => \{\n"
              r"    if \(!selectedScale\) return null;\n"
              r"    return \{\n"
              r"      capacityRange: `\$\{selectedScale\.minimumCapacity\.toLocaleString\(\"en-GB\"\)\}–\$\{selectedScale\.maximumCapacity\.toLocaleString\(\"en-GB\"\)\}`,\n"
              r"      maximumDuration: selectedScale\.maximumDurationDays,\n"
              r"      demandEffect: selectedMarketing\n"
              r"        \? Math\.round\(\(selectedMarketing\.demandBasisPoints - 10000\) / 100\)\n"
              r"        : 0,\n"
              r"      costEffect: selectedMarketing\n"
              r"        \? Math\.round\(\(selectedMarketing\.costBasisPoints - 10000\) / 100\)\n"
              r"        : 0,\n"
              r"    \};\n"
              r"  \}, \[selectedMarketing, selectedScale\]\);"
          )
          replacement = '''  const localPreview = selectedScale
            ? {
                capacityRange: `${selectedScale.minimumCapacity.toLocaleString("en-GB")}–${selectedScale.maximumCapacity.toLocaleString("en-GB")}`,
                demandEffect: selectedMarketing
                  ? Math.round((selectedMarketing.demandBasisPoints - 10000) / 100)
                  : 0,
              }
            : null;'''
          source, replacements = pattern.subn(replacement, source)
          if replacements != 1:
              raise SystemExit(f"expected one annual preview block, found {replacements}")
          path.write_text(source)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/festivals/annual-plan/FestivalAnnualPlan.tsx
          git commit -m "Keep annual Festival plan component hook-safe"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
