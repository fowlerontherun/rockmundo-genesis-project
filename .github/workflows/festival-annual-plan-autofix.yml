name: Festival annual plan edit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Apply focused annual plan fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          component = Path("src/features/festivals/annual-plan/FestivalAnnualPlan.tsx")
          source = component.read_text()
          source = source.replace(
              'import { useEffect, useMemo, useRef, useState } from "react";',
              'import { useEffect, useRef, useState } from "react";',
          )
          start_marker = "  const localPreview = useMemo(() => {"
          end_marker = "  }, [selectedMarketing, selectedScale]);"
          if start_marker in source:
              start = source.index(start_marker)
              end = source.index(end_marker, start) + len(end_marker)
              replacement = '''  const localPreview = selectedScale
            ? {
                capacityRange: `${selectedScale.minimumCapacity.toLocaleString("en-GB")}–${selectedScale.maximumCapacity.toLocaleString("en-GB")}`,
                demandEffect: selectedMarketing
                  ? Math.round((selectedMarketing.demandBasisPoints - 10000) / 100)
                  : 0,
              }
            : null;'''
              source = source[:start] + replacement + source[end:]
          elif "  const localPreview = selectedScale" not in source:
              raise SystemExit("annual plan preview block missing")
          component.write_text(source)

          migration = Path("supabase/migrations/20291218245300_festival_simplified_annual_plan.sql")
          sql = migration.read_text()
          replacements = {
              "  preferred_month integer;": "  selected_month integer;",
              "  preferred_month := nullif(p_plan->>'preferredMonth', '')::integer;": "  selected_month := nullif(p_plan->>'preferredMonth', '')::integer;",
              "  IF start_date IS NULL OR duration IS NULL OR preferred_month IS NULL": "  IF start_date IS NULL OR duration IS NULL OR selected_month IS NULL",
              "     OR preferred_month NOT BETWEEN 1 AND 12": "     OR selected_month NOT BETWEEN 1 AND 12",
              "     OR extract(month FROM start_date)::integer <> preferred_month THEN": "     OR extract(month FROM start_date)::integer <> selected_month THEN",
              "      preferred_month = preferred_month,": "      preferred_month = selected_month,",
          }
          for old, new in replacements.items():
              if old in sql:
                  sql = sql.replace(old, new)
              elif new not in sql:
                  raise SystemExit(f"annual SQL marker missing: {old}")

          save_start = sql.index("CREATE OR REPLACE FUNCTION public.save_festival_edition_annual_plan(")
          save_end = sql.index("\n$$;", save_start) + len("\n$$;")
          save = sql[save_start:save_end]
          if "  result jsonb;" in save:
              save = save.replace("  result jsonb;", "  response jsonb;", 1)
              save = save.replace(
                  "  result := public._festival_annual_plan_result(company.id, edition.id);",
                  "  response := public._festival_annual_plan_result(company.id, edition.id);",
                  1,
              )
              save = save.replace(
                  "  SET status = 'succeeded', result = result, completed_at = now()",
                  "  SET status = 'succeeded', result = response, completed_at = now()",
                  1,
              )
              save = save.replace("  RETURN result;", "  RETURN response;", 1)
              sql = sql[:save_start] + save + sql[save_end:]
          elif "  response jsonb;" not in save:
              raise SystemExit("annual save response variable missing")
          migration.write_text(sql)
          PY
          if git diff --quiet -- src/features/festivals/annual-plan/FestivalAnnualPlan.tsx supabase/migrations/20291218245300_festival_simplified_annual_plan.sql; then
            echo "Focused annual plan fixes already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/festivals/annual-plan/FestivalAnnualPlan.tsx supabase/migrations/20291218245300_festival_simplified_annual_plan.sql
          git commit -m "Fix annual Festival SQL receipt persistence"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
