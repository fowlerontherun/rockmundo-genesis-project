name: Temporary C3 Festival Mode Finalizer

on:
  push:
    branches:
      - agent/festival-c3-mode-shell

permissions:
  contents: write

jobs:
  finalize-c3:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/festival-c3-mode-shell
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Verify C3 Festival Mode contract
        run: npx vitest run src/features/festival-company/__tests__/festivalModeShellC3.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Mark C3 complete
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'docs/IMPLEMENTATION_BACKLOG.md';
          let text = fs.readFileSync(path, 'utf8');
          const start = text.indexOf('## PR C3 — Festival Mode shell and reduced game UI');
          const end = text.indexOf('\n---', start);
          if (start < 0 || end < 0) throw new Error('C3 backlog block not found');
          let block = text.slice(start, end);
          block = block.replace(
            '## PR C3 — Festival Mode shell and reduced game UI',
            '## PR C3 — Festival Mode shell and reduced game UI ([#1647](https://github.com/fowlerontherun/rockmundo-genesis-project/pull/1647))',
          );
          block = block.replace('**Status:** NOT STARTED', '**Status:** COMPLETE');
          if (!block.includes('### Implementation notes')) {
            block = block.replace(
              '\n### Dependencies',
              '\n### Implementation notes\n\n- Authoritative `attending` state now intercepts both desktop and mobile before normal RockMundo navigation renders.\n- Festival Mode has distinct desktop and mobile reduced shells with Home, My Day, Food & Drink, Activities and Inbox navigation.\n- Inbox, safety/reporting, blocked-player management and bug reporting remain reachable without exposing normal gameplay navigation.\n- The route interrupted by check-in is stored per active profile and restored after authoritative leave, completion, cancellation or refund.\n- Refresh/reconnect rehydrates from attendee state; transient attendance-query failures fail closed when the tab was already in Festival Mode.\n- Focused C3 routing/shell tests and full TypeScript checking passed before this item was marked complete.\n\n### Dependencies',
            );
          }
          text = text.slice(0, start) + block + text.slice(end);
          fs.writeFileSync(path, text);
          NODE

      - name: Remove temporary finalizer
        run: rm .github/workflows/temp-finalize-c3.yml

      - name: Commit backlog completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION_BACKLOG.md .github/workflows/temp-finalize-c3.yml
          git commit -m "docs(backlog): mark Festival C3 complete"
          git push origin HEAD:agent/festival-c3-mode-shell
