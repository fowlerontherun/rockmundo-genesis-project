name: Festival DB validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create canonical Festival contract fixture
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE TYPE public.app_role AS ENUM ('admin', 'user');

          CREATE FUNCTION auth.uid() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;

          CREATE FUNCTION public._caller_profile_id() RETURNS uuid
          LANGUAGE sql STABLE
          AS $$ SELECT auth.uid() $$;

          CREATE FUNCTION public.has_role(uuid, public.app_role) RETURNS boolean
          LANGUAGE sql STABLE
          AS $$ SELECT false $$;

          CREATE FUNCTION public.rockmundo_game_year() RETURNS integer
          LANGUAGE sql STABLE
          AS $$ SELECT 5 $$;

          CREATE TABLE public.festival_companies (
            id uuid PRIMARY KEY,
            owner_profile_id uuid NOT NULL,
            public_name text NOT NULL,
            status text NOT NULL,
            setup_completed boolean NOT NULL DEFAULT false
          );

          CREATE TABLE public.festival_editions_v2 (
            id uuid PRIMARY KEY,
            festival_company_id uuid NOT NULL REFERENCES public.festival_companies(id),
            edition_year integer NOT NULL,
            name text NOT NULL,
            status text NOT NULL,
            starts_on date,
            ends_on date,
            country_code text,
            city_id uuid,
            vibe text,
            site_type text,
            duration_days integer,
            environmental_policy text,
            festival_scale text,
            expected_capacity integer,
            version integer NOT NULL DEFAULT 1,
            locked_at timestamptz,
            creation_source text NOT NULL DEFAULT 'setup'
          );

          CREATE TABLE public.festival_configurations (festival_company_id uuid, festival_edition_id uuid);
          CREATE TABLE public.festival_site_plans (festival_company_id uuid, festival_edition_id uuid);
          CREATE TABLE public.festival_ticket_plans (festival_company_id uuid, festival_edition_id uuid);
          CREATE TABLE public.festival_artist_programmes (festival_company_id uuid, festival_edition_id uuid);
          CREATE TABLE public.festival_operations_plans (festival_company_id uuid, festival_edition_id uuid);
          CREATE TABLE public.festival_sponsorship_plans (festival_company_id uuid, festival_edition_id uuid);
          CREATE TABLE public.festival_timetable_plans (festival_company_id uuid, festival_edition_id uuid);
          SQL
      - name: Apply owner edition directory migration
        run: psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20291218245000_festival_owner_edition_directory.sql
      - name: Exercise permissions and owner read model
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF to_regprocedure('public.get_festival_company_editions(uuid)') IS NULL THEN
              RAISE EXCEPTION 'get_festival_company_editions(uuid) was not deployed';
            END IF;
            IF has_function_privilege('anon', 'public.get_festival_company_editions(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'anon must not execute get_festival_company_editions(uuid)';
            END IF;
            IF NOT has_function_privilege('authenticated', 'public.get_festival_company_editions(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'authenticated role must execute get_festival_company_editions(uuid)';
            END IF;
          END
          $$;

          INSERT INTO public.festival_companies
            (id, owner_profile_id, public_name, status, setup_completed)
          VALUES
            ('11111111-1111-4111-8111-111111111111', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', 'Contract Festival', 'active', true);

          INSERT INTO public.festival_editions_v2
            (id, festival_company_id, edition_year, name, status, starts_on, ends_on, country_code, duration_days, festival_scale, expected_capacity, version, creation_source)
          VALUES
            ('22222222-2222-4222-8222-222222222222', '11111111-1111-4111-8111-111111111111', 5, 'Contract Festival', 'draft', '2026-08-10', '2026-08-12', 'GB', 3, 'small', 5000, 2, 'setup'),
            ('33333333-3333-4333-8333-333333333333', '11111111-1111-4111-8111-111111111111', 4, 'Contract Festival', 'completed', '2025-08-10', '2025-08-11', 'GB', 2, 'local', 1500, 7, 'legacy');

          INSERT INTO public.festival_configurations VALUES ('11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222');
          INSERT INTO public.festival_site_plans VALUES ('11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222');
          INSERT INTO public.festival_ticket_plans VALUES ('11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222');
          INSERT INTO public.festival_artist_programmes VALUES ('11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222');
          INSERT INTO public.festival_operations_plans VALUES ('11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222');
          INSERT INTO public.festival_sponsorship_plans VALUES ('11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222');
          INSERT INTO public.festival_timetable_plans VALUES ('11111111-1111-4111-8111-111111111111', '22222222-2222-4222-8222-222222222222');

          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub', 'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa', false);
          DO $$
          DECLARE payload jsonb;
          BEGIN
            payload := public.get_festival_company_editions('11111111-1111-4111-8111-111111111111');
            IF payload->>'publicName' <> 'Contract Festival' THEN
              RAISE EXCEPTION 'unexpected public name: %', payload;
            END IF;
            IF payload->>'canPlanNext' <> 'true' OR (payload->>'currentGameYear')::integer <> 5 THEN
              RAISE EXCEPTION 'unexpected company state: %', payload;
            END IF;
            IF jsonb_array_length(payload->'editions') <> 2 THEN
              RAISE EXCEPTION 'unexpected edition count: %', payload;
            END IF;
            IF NOT payload @> '{"editions":[{"editionYear":5,"editable":true,"planBindings":{"configuration":true,"site":true,"tickets":true,"artists":true,"operations":true,"sponsorship":true,"timetable":true}}]}'::jsonb THEN
              RAISE EXCEPTION 'draft edition bindings were not returned: %', payload;
            END IF;
            IF NOT payload @> '{"editions":[{"editionYear":4,"editable":false}]}'::jsonb THEN
              RAISE EXCEPTION 'completed edition was not read-only: %', payload;
            END IF;
          END
          $$;

          SELECT set_config('request.jwt.claim.sub', 'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb', false);
          DO $$
          BEGIN
            PERFORM public.get_festival_company_editions('11111111-1111-4111-8111-111111111111');
            RAISE EXCEPTION 'non-owner access unexpectedly succeeded';
          EXCEPTION
            WHEN SQLSTATE 'P0001' THEN
              IF SQLERRM <> 'festival_edition_forbidden' THEN
                RAISE;
              END IF;
          END
          $$;
          RESET ROLE;
          SQL
