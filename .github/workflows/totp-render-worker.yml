name: TOTP deterministic render worker

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: totp-render-worker
  cancel-in-progress: false

jobs:
  render-one:
    name: Render one queued Top of the Pops episode
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check render queue
        id: queue
        env:
          TOTP_RENDER_BROKER_URL: https://yztogmdixmchsmimtent.supabase.co/functions/v1/totp-render-broker
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          async function main() {
            const requestUrl = process.env.ACTIONS_ID_TOKEN_REQUEST_URL;
            const requestToken = process.env.ACTIONS_ID_TOKEN_REQUEST_TOKEN;
            if (!requestUrl || !requestToken) throw new Error("GitHub OIDC is unavailable.");
            const separator = requestUrl.includes("?") ? "&" : "?";
            const tokenResponse = await fetch(`${requestUrl}${separator}audience=rockmundo-totp-render`, {
              headers: { Authorization: `Bearer ${requestToken}` },
            });
            if (!tokenResponse.ok) throw new Error(`OIDC failed: ${tokenResponse.status} ${await tokenResponse.text()}`);
            const { value } = await tokenResponse.json();
            const response = await fetch(process.env.TOTP_RENDER_BROKER_URL, {
              method: "POST",
              headers: { Authorization: `Bearer ${value}`, "Content-Type": "application/json" },
              body: JSON.stringify({ operation: "peek" }),
            });
            const body = await response.json();
            if (!response.ok) throw new Error(body.error || `Queue check failed with HTTP ${response.status}`);
            const hasWork = body.hasWork === true;
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `has_work=${hasWork}\n`);
            console.log(hasWork ? "A render job is ready." : "No render work is queued; exiting cheaply.");
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          NODE

      - name: Checkout main
        if: steps.queue.outputs.has_work == 'true'
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node
        if: steps.queue.outputs.has_work == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        if: steps.queue.outputs.has_work == 'true'
        run: npm install --global npm@10.9.2

      - name: Install application dependencies
        if: steps.queue.outputs.has_work == 'true'
        run: npm ci

      - name: Install Chromium and FFmpeg
        if: steps.queue.outputs.has_work == 'true'
        run: |
          npx playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify render worker helpers
        if: steps.queue.outputs.has_work == 'true'
        run: node --test workers/totp-render-worker/lib.test.mjs

      - name: Build deterministic render page
        if: steps.queue.outputs.has_work == 'true'
        run: npm run build

      - name: Start local render page
        if: steps.queue.outputs.has_work == 'true'
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 >/tmp/totp-render-vite.log 2>&1 &
          for i in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173/totp-render.html >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/totp-render-vite.log
          exit 1

      - name: Claim and render one episode
        if: steps.queue.outputs.has_work == 'true'
        env:
          TOTP_RENDER_BROKER_URL: https://yztogmdixmchsmimtent.supabase.co/functions/v1/totp-render-broker
          TOTP_RENDER_PAGE_URL: http://127.0.0.1:4173/totp-render.html
        run: node workers/totp-render-worker/index.mjs

      - name: Print renderer server log on failure
        if: failure() && steps.queue.outputs.has_work == 'true'
        run: cat /tmp/totp-render-vite.log || true