name: Festival edition projection SQL edit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Harden projection SQL contracts
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          migration = Path("supabase/migrations/20291218245500_festival_edition_internal_projections.sql")
          sql = migration.read_text()
          sql = sql.replace("  forecast jsonb;", "  projection_forecast jsonb;")
          sql = sql.replace(
              "  forecast := public._festival_projection_forecast(",
              "  projection_forecast := public._festival_projection_forecast(",
          )
          sql = sql.replace(
              "  SET forecast = forecast,",
              "  SET forecast = projection_forecast,",
          )
          sql = re.sub(
              r"  SELECT coalesce\(planning_version, 0\) INTO old_version\n"
              r"  FROM public\.festival_artist_programmes\n"
              r"  WHERE festival_edition_id = edition\.id\n"
              r"  FOR UPDATE;",
              "  SELECT coalesce(max(planning_version), 0) INTO old_version\n"
              "  FROM public.festival_artist_programmes\n"
              "  WHERE festival_edition_id = edition.id;",
              sql,
          )

          ticket_start = sql.index(
              "CREATE OR REPLACE FUNCTION public.save_festival_edition_ticket_plan"
          )
          ticket_end = sql.index("\n$$;", ticket_start) + len("\n$$;")
          ticket = sql[ticket_start:ticket_end]
          ticket_check = '''  IF ticket.planning_version <> p_expected_version THEN
            RAISE EXCEPTION 'festival_ticket_plan_stale' USING ERRCODE = 'P0001';
          END IF;
          '''
          ticket = ticket.replace(ticket_check, "", 1)
          ticket_mutation = "  UPDATE public.festival_ticket_plans\n  SET expected_sell_through_basis_points"
          if ticket.count(ticket_mutation) != 1:
              raise SystemExit("ticket mutation boundary missing")
          ticket = ticket.replace(
              ticket_mutation,
              ticket_check + "\n" + ticket_mutation,
              1,
          )
          if ticket.index("request.status = 'succeeded'") > ticket.index("festival_ticket_plan_stale"):
              raise SystemExit("ticket replay still follows stale check")
          sql = sql[:ticket_start] + ticket + sql[ticket_end:]

          artist_start = sql.index(
              "CREATE OR REPLACE FUNCTION public.save_festival_edition_artist_programme"
          )
          artist_end = sql.index("\n$$;", artist_start) + len("\n$$;")
          artist = sql[artist_start:artist_end]
          artist_check = '''  SELECT coalesce(max(planning_version), 0) INTO old_version
          FROM public.festival_artist_programmes
          WHERE festival_edition_id = edition.id;
          IF old_version <> p_expected_version THEN
            RAISE EXCEPTION 'festival_artist_programme_stale' USING ERRCODE = 'P0001';
          END IF;
          '''
          artist = artist.replace(artist_check, "", 1)
          artist_mutation = "  INSERT INTO public.festival_artist_programmes("
          if artist.count(artist_mutation) != 1:
              raise SystemExit("artist mutation boundary missing")
          artist = artist.replace(
              artist_mutation,
              artist_check + "\n" + artist_mutation,
              1,
          )
          if artist.index("request.status = 'succeeded'") > artist.index("festival_artist_programme_stale"):
              raise SystemExit("artist replay still follows stale check")
          sql = sql[:artist_start] + artist + sql[artist_end:]

          if re.search(r"^\s*SET forecast = forecast,", sql, re.MULTILINE):
              raise SystemExit("ambiguous forecast assignment remains")
          if re.search(r"^\s*forecast := public\._festival_projection_forecast", sql, re.MULTILINE):
              raise SystemExit("ambiguous forecast variable remains")
          migration.write_text(sql)
          PY
          if git diff --quiet -- supabase/migrations/20291218245500_festival_edition_internal_projections.sql; then
            echo "Projection SQL contracts already hardened."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20291218245500_festival_edition_internal_projections.sql
          git commit -m "Make edition projection retries idempotent"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
