name: Festival & Touring Integration Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/reconciliation/**'
      - 'supabase/tests/**'
      - 'scripts/festivals/**'
      - 'scripts/supabase/festival-production-reconciliation.json'
      - 'src/features/festival-company/**'
      - 'src/features/festivals/**'
      - 'src/testing/**'
      - 'src/integrations/supabase/types.ts'
      - 'vitest.setup.ts'
      - 'vitest.config.*'
      - 'vite.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.nvmrc'
      - '.github/workflows/festival-runtime-gate.yml'

concurrency:
  group: festival-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  touring:
    name: Touring integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Verify dependency lock
        run: npm run verify:dependency-lock
      - name: Install dependencies
        run: npm ci
      - name: Verify serial certification worker contract
        run: node --test scripts/festivals/vitest-serial-certification.test.mjs
      - name: Run touring integration tests
        run: npm run test:touring

  quality:
    name: Festival static certification, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FESTIVAL_TEST_DATABASE_CONFIRMED: 'true'
      SUPABASE_CLI_VERSION: '2.31.8'
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_STARTED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Print frontend tool versions
        run: |
          node --version
          npm --version
      - name: Verify dependency lock
        run: npm run verify:dependency-lock
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint:ci
      - name: Typecheck
        run: npm run typecheck
      - name: Run Festival static certification
        run: |
          npm run test:festivals
          node scripts/festivals/certify-performance-effects-harness.mjs
          npm run test:festivals:routes
          npm run test:festivals:app-routes
          npm run test:festivals:active-callers
          npm run test:festivals:settlement
          npm run test:festivals:effects
          npm run test:festivals:performance-effects
      - name: Build
        run: npm run build

  database-lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FESTIVAL_TEST_DATABASE_CONFIRMED: 'true'
      SUPABASE_CLI_VERSION: '2.31.8'
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_STARTED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Verify dependency lock
        run: npm run verify:dependency-lock
      - name: Install dependencies
        run: npm ci
      - name: Verify Docker
        run: |
          command -v docker
          docker info
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.31.8
      - name: Print database tool versions
        run: |
          supabase --version
          psql --version
      - name: Start local Supabase stack
        run: |
          mkdir -p festival-runtime-diagnostics
          supabase stop --no-backup || true
          set -o pipefail
          supabase start --debug 2>&1 | tee festival-runtime-diagnostics/supabase-start.log
          echo "SUPABASE_STARTED=true" >> "$GITHUB_ENV"
          db_url="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$db_url"
          case "$db_url" in
            postgresql://postgres:*@127.0.0.1:54322/postgres|postgres://postgres:*@127.0.0.1:54322/postgres) ;;
            *) echo "Refusing non-disposable database URL" >&2; exit 2 ;;
          esac
          echo "SUPABASE_DB_URL=$db_url" >> "$GITHUB_ENV"
      - name: Reset migrated test database
        run: |
          mkdir -p festival-runtime-diagnostics
          set -o pipefail
          supabase db reset 2>&1 | tee festival-runtime-diagnostics/migration-reset.log
      - name: Apply and certify Festival production parity overlay
        run: |
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/reconciliation/festival/20260822_simplified_festival_post_bootstrap.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/festival_simplified_production_overlay_regression.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/festival_finance_engagement_regression.sql
      - name: Run Festival upgrade post-deployment diagnostic
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/diagnostics/festival_upgrade_v2_postdeploy.sql
      - name: Run authenticated Festival upgrade database gate
        run: |
          set -o pipefail
          npm run test:festivals:upgrades:db 2>&1 | tee festival-runtime-diagnostics/upgrades-first-run.log
      - name: Verify deterministic radio catalogue seeds
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/radio_catalogue_seed_regression.sql
      - name: Run live-performance database certification
        run: |
          set -o pipefail
          npm run test:festivals:performance-effects:db 2>&1 | tee festival-runtime-diagnostics/performance-effects-first-run.log
      - name: Verify required Supabase RPCs
        run: npm run verify:supabase-rpcs
      - name: Verify database safety guard
        run: npm run test:festivals:safety-guard
      - name: Run canonical festival runtime gate
        run: |
          npm run test:festivals:certification
          npm run test:festivals:company-runtime
      - name: Reset migrated test database before clean replay
        run: |
          set -o pipefail
          supabase db reset 2>&1 | tee festival-runtime-diagnostics/migration-reset-second.log
      - name: Reapply and certify Festival production parity overlay
        run: |
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/reconciliation/festival/20260822_simplified_festival_post_bootstrap.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/festival_simplified_production_overlay_regression.sql
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/festival_finance_engagement_regression.sql
      - name: Rerun authenticated Festival upgrade database gate
        run: |
          set -o pipefail
          npm run test:festivals:upgrades:db 2>&1 | tee festival-runtime-diagnostics/upgrades-replay-run.log
      - name: Rerun live-performance database certification
        run: |
          set -o pipefail
          npm run test:festivals:performance-effects:db 2>&1 | tee festival-runtime-diagnostics/performance-effects-replay-run.log
      - name: Compare clean-database certification summaries
        run: |
          first="$(grep '^FESTIVAL_LIFECYCLE_SUMMARY ' festival-runtime-diagnostics/performance-effects-first-run.log)"
          second="$(grep '^FESTIVAL_LIFECYCLE_SUMMARY ' festival-runtime-diagnostics/performance-effects-replay-run.log)"
          test -n "$first"
          test "$first" = "$second"
          for summary in "$first" "$second"; do
            echo "$summary" | grep -Eq 'claimed_effects=[1-9][0-9]*'
            echo "$summary" | grep -Eq 'processed_effects=[1-9][0-9]*'
            echo "$summary" | grep -Eq 'acknowledged_effects=[1-9][0-9]*'
            echo "$summary" | grep -q 'completed_settlements=1'
            echo "$summary" | grep -q 'distinct_effect_types=7'
            echo "$summary" | grep -q 'replayed_effect_types=7'
            echo "$summary" | grep -q 'recovered_effects=1'
            echo "$summary" | grep -q 'overlap_duplicates=0'
            echo "$summary" | grep -q 'duplicate_canonical_records=0'
            echo "$summary" | grep -q 'failed_assertions=0'
          done

      - name: Capture runtime diagnostics
        if: always()
        run: |
          mkdir -p festival-runtime-diagnostics
          docker ps -a > festival-runtime-diagnostics/docker-ps.txt 2>&1 || true
          docker system df > festival-runtime-diagnostics/docker-disk-usage.txt 2>&1 || true
          df -h > festival-runtime-diagnostics/filesystem-space.txt 2>&1 || true
          supabase --version > festival-runtime-diagnostics/supabase-version.txt 2>&1 || true
          docker version > festival-runtime-diagnostics/docker-version.txt 2>&1 || true
          supabase status > festival-runtime-diagnostics/supabase-status.txt 2>&1 || true
          for container in $(docker ps -a --filter 'name=supabase' --format '{{.Names}}'); do
            docker logs "$container" > "festival-runtime-diagnostics/container-${container}.log" 2>&1 || true
          done
          if [ "$SUPABASE_STARTED" = true ]; then
            supabase logs db > festival-runtime-diagnostics/db.log 2>&1 || true
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=0 -f scripts/festivals/runtime-diagnostics.sql \
              > festival-runtime-diagnostics/database-summary.txt 2>&1 || true
            psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=0 -c "SELECT * FROM public.festival_upgrade_migration_summary; SELECT * FROM public.festival_upgrade_purchase_operations; SELECT * FROM public.festival_company_upgrades; SELECT * FROM public.festival_edition_upgrade_snapshots;" > festival-runtime-diagnostics/upgrade-summary.txt 2>&1 || true
          fi
          find festival-runtime-diagnostics -type f -exec sed -i -E 's#postgres(ql)?://[^[:space:]]+#postgresql://[redacted]#g; s#(password=)[^[:space:]]+#\1[redacted]#g; s#(JWT_SECRET|ACCESS_TOKEN|SUPABASE_ACCESS_TOKEN)=([^[:space:]]+)#\1=[redacted]#g' {} +
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: festival-runtime-diagnostics
          path: festival-runtime-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Supabase stack
        if: ${{ always() && env.SUPABASE_STARTED == 'true' }}
        run: supabase stop --no-backup
