name: Festival runtime gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
      - 'scripts/festivals/**'
      - 'src/features/festival-company/**'
      - 'src/testing/**'
      - 'src/integrations/supabase/types.ts'
      - 'vitest.setup.ts'
      - 'vitest.config.*'
      - 'vite.config.*'
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
      - '.nvmrc'
      - '.github/workflows/festival-runtime-gate.yml'

concurrency:
  group: festival-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  festival-runtime-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FESTIVAL_TEST_DATABASE_CONFIRMED: 'true'
      SUPABASE_CLI_VERSION: '2.31.8'
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Print frontend tool versions
        run: |
          node --version
          npm --version
      - name: Install dependencies
        run: npm ci
      - name: Verify dependency tree
        run: npm run verify:dependencies
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Run full unit tests
        run: npm run test:unit
      - name: Run smoke test suite
        run: npm run test:smoke
      - name: Verify the DOM environment
        run: npx vitest run src/testing/__tests__/vitestDomEnvironment.test.tsx
      - name: Run festival frontend unit tests
        run: npx vitest run src/features/festival-company
      - name: Build
        run: npm run build
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.31.8
      - name: Print database tool versions
        run: |
          supabase --version
          psql --version
      - name: Start local Supabase stack
        run: supabase start
      - name: Reset migrated test database
        run: |
          mkdir -p festival-runtime-diagnostics
          set -o pipefail
          supabase db reset 2>&1 | tee festival-runtime-diagnostics/migration-reset.log
      - name: Run live-performance database certification
        run: |
          set -o pipefail
          npm run test:festivals:performance-effects:db 2>&1 | tee festival-runtime-diagnostics/performance-effects-first-run.log
      - name: Verify required Supabase RPCs
        run: npm run verify:supabase-rpcs
      - name: Verify database safety guard
        run: npm run test:festivals:safety-guard
      - name: Run canonical festival runtime gate
        run: npm run test:festivals:company-runtime
      - name: Rerun live-performance database certification
        run: |
          set -o pipefail
          npm run test:festivals:performance-effects:db 2>&1 | tee festival-runtime-diagnostics/performance-effects-replay-run.log

      - name: Capture runtime diagnostics
        if: always()
        run: |
          mkdir -p festival-runtime-diagnostics
          supabase status > festival-runtime-diagnostics/supabase-status.txt 2>&1 || true
          supabase logs db > festival-runtime-diagnostics/db.log 2>&1 || true
          psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=0 -f scripts/festivals/runtime-diagnostics.sql \
            > festival-runtime-diagnostics/database-summary.txt 2>&1 || true
          sed -i -E 's#postgres(ql)?://[^[:space:]]+#postgresql://[redacted]#g; s#(password=)[^[:space:]]+#\1[redacted]#g' festival-runtime-diagnostics/* || true
      - name: Upload runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: festival-runtime-diagnostics
          path: festival-runtime-diagnostics/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
