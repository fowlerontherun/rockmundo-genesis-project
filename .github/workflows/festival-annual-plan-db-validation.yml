name: Festival annual plan database validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: festival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d festival_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: festival_test
    steps:
      - uses: actions/checkout@v4
      - name: Execute simplified annual Festival contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/festival_simplified_annual_plan_harness.sql
