name: Festival annual plan database validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: festival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d festival_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: festival_test
    steps:
      - uses: actions/checkout@v4
      - name: Execute simplified annual Festival contract
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/festival_simplified_annual_plan_harness.sql
      - name: Apply and verify explicit RPC grants
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/20291218245400_festival_simplified_annual_plan_security.sql
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF has_function_privilege('anon', 'public.get_festival_company_editions(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'anon unexpectedly has edition directory execute privilege';
            END IF;
            IF NOT has_function_privilege('authenticated', 'public.get_festival_company_editions(uuid)', 'EXECUTE') THEN
              RAISE EXCEPTION 'authenticated role is missing edition directory execute privilege';
            END IF;
          END
          $$;
          SQL
