name: Repair dependency lock for PR 1548

on:
  push:
    branches:
      - agent/fix-skill-practice-booking
    paths:
      - .github/workflows/repair-dependency-lock-pr1548.yml
      - package.json
      - package-lock.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/repair-dependency-lock-pr1548.yml
      - package.json
      - package-lock.json

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]' && (github.event_name != 'pull_request' || github.event.pull_request.head.ref == 'agent/fix-skill-practice-booking')
    runs-on: ubuntu-24.04
    concurrency:
      group: repair-dependency-lock-pr1548
      cancel-in-progress: true
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/fix-skill-practice-booking
          fetch-depth: 0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use repository npm version
        run: npm install --global npm@10.9.2

      - name: Regenerate lockfile from registry metadata
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify dependency lock
        run: npm run verify:dependency-lock

      - name: Verify clean install
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify dependency tree
        run: npm run verify:dependencies

      - name: Commit generated lockfile
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already canonical"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Regenerate npm dependency lock"
          git push origin HEAD:agent/fix-skill-practice-booking
