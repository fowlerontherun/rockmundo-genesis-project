name: Avatar V2 Phase 1 body rig contract

on:
  pull_request:
    paths:
      - 'scripts/avatar-v2/phase1_body_contract.py'
      - 'scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_body.py'
      - 'scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_autobind_probe.py'
      - 'scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_source_smoke.py'
      - 'scripts/avatar-v2/tests/test_phase1_body_contract.py'
      - 'docs/avatar-v2-phase1-body-rigs.md'
      - '.github/workflows/avatar-v2-phase1-body.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/avatar-v2/phase1_body_contract.py'
      - 'scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_body.py'
      - 'scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_autobind_probe.py'
      - 'scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_source_smoke.py'
      - 'scripts/avatar-v2/tests/test_phase1_body_contract.py'
      - '.github/workflows/avatar-v2-phase1-body.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  phase1-authoring-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile phase 1 Blender adapter and shared geometry rules
        run: |
          python3 -m py_compile \
            scripts/avatar-v2/phase1_body_contract.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_body.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_autobind_probe.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_phase1_source_smoke.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_fit_rig.py \
            scripts/avatar-v2/blender/rockmundo_avatar_v2_weight_audit.py
      - name: Test independent both-frame weight, region and pose gates
        run: python3 -m unittest discover -s scripts/avatar-v2/tests -p test_phase1_body_contract.py -v
      - name: Regression-test artist joint fitting and genuine binary GLB validation
        run: |
          python3 -m unittest discover -s scripts/avatar-v2/tests -p test_rig_landmarks.py -v
          python3 -m unittest discover -s scripts/avatar-v2/tests -p test_verify_skinned_glb.py -v
      - name: Enforce non-promotion of unreviewed source-only bodies
        run: node scripts/avatar-v2/validate-assets.mjs
