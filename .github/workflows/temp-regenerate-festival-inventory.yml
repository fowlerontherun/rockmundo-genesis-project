name: Temporary Festival Inventory Regeneration

on:
  push:
    branches:
      - agent/complete-festival-lineup-inventory

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/complete-festival-lineup-inventory
          fetch-depth: 0

      - name: Regenerate Festival inventory from current branch
        run: node scripts/festivals/certify-active-system.mjs

      - name: Commit generated inventory when changed
        shell: bash
        run: |
          if git diff --quiet -- docs/festivals/festival-active-callers.json; then
            echo "Festival inventory is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/festivals/festival-active-callers.json
          git commit -m "Regenerate Festival active inventory"
          git push origin HEAD:agent/complete-festival-lineup-inventory
