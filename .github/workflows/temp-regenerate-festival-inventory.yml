name: Temporary Festival Inventory Regeneration

on:
  push:
    branches:
      - agent/simplify-festival-permits
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  regenerate:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out Festival branch
        uses: actions/checkout@v4
        with:
          ref: agent/simplify-festival-permits
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Regenerate Festival inventory
        run: node scripts/festivals/certify-active-system.mjs

      - name: Commit inventory and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-regenerate-festival-inventory.yml
          git add docs/festivals/festival-active-callers.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Regenerate Festival inventory and remove helper"
          git push origin HEAD:agent/simplify-festival-permits
