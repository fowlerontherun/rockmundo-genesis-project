name: Temporary C2 Festival Finalizer

on:
  push:
    branches:
      - agent/festival-c2-attendee-lifecycle

permissions:
  contents: write

jobs:
  finalize-c2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use repository npm version
        run: npm install --global npm@10.9.2

      - name: Install dependencies
        run: npm ci

      - name: Verify C2 contract
        run: npx vitest run src/features/festival-company/__tests__/festivalAttendeeLifecycleC2.test.ts

      - name: Verify migration timestamp policy
        run: node scripts/supabase/verify-migration-timestamps.mjs

      - name: Mark C2 complete
        run: python scripts/festivals/temp-finalize-c2.py

      - name: Remove temporary finalizer
        run: |
          rm scripts/festivals/temp-finalize-c2.py
          rm .github/workflows/temp-finalize-c2.yml

      - name: Commit backlog completion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/IMPLEMENTATION_BACKLOG.md scripts/festivals/temp-finalize-c2.py .github/workflows/temp-finalize-c2.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "docs(backlog): mark C2 complete"
          git push origin "HEAD:${GITHUB_REF_NAME}"
