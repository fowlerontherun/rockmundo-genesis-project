name: Temporary Certify Festival Runtime Currency

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  certify:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out finalized Festival branch
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-festival-runtime-currency-v2
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Focused runtime currency regression
        run: npx vitest run src/features/festivals/runtime/runtimeCurrency.test.ts

      - name: Verify Festival active-caller inventory
        run: npm run test:festivals:active-callers

      - name: Build
        run: npm run build

      - name: Remove certification helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-certify-festival-runtime-currency.yml
          git commit -m "Remove Festival runtime currency certification helper"
          git push origin HEAD:agent/finalize-festival-runtime-currency-v2
