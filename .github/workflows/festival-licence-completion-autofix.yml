name: Festival licence completion SQL fix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Fix licence migration portability
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/20291218245600_festival_licence_and_manager_authority.sql")
          source = migration.read_text()

          direct_drops = """ALTER TABLE public.festival_company_licences
            DROP CONSTRAINT IF EXISTS festival_company_licences_festival_company_id_tier_key_status_key;
          ALTER TABLE public.festival_company_licences
            DROP CONSTRAINT IF EXISTS festival_company_licences_festival_company_id_tier_key_status_k;
          """
          robust_drop = """DO $$
          DECLARE
            legacy_constraint record;
          BEGIN
            FOR legacy_constraint IN
              SELECT conname
              FROM pg_constraint
              WHERE conrelid = 'public.festival_company_licences'::regclass
                AND contype = 'u'
                AND pg_get_constraintdef(oid) =
                  'UNIQUE (festival_company_id, tier_key, status)'
            LOOP
              EXECUTE format(
                'ALTER TABLE public.festival_company_licences DROP CONSTRAINT %I',
                legacy_constraint.conname
              );
            END LOOP;
          END;
          $$;
          """
          if direct_drops in source:
              source = source.replace(direct_drops, robust_drop, 1)
          elif robust_drop not in source:
              raise SystemExit("licence uniqueness anchor not found")

          old_hash = """  payload_hash := encode(digest(jsonb_build_object(
              'festivalCompanyId', company.id,
              'tierKey', p_requested_tier_key,
              'expectedLicenceVersion', p_expected_licence_version
            )::text, 'sha256'), 'hex');
          """
          new_hash = """  payload_hash := md5(jsonb_build_object(
              'festivalCompanyId', company.id,
              'tierKey', p_requested_tier_key,
              'expectedLicenceVersion', p_expected_licence_version
            )::text);
          """
          if old_hash in source:
              source = source.replace(old_hash, new_hash, 1)
          elif new_hash not in source:
              raise SystemExit("licence payload hash anchor not found")

          start = source.index(
              "CREATE OR REPLACE FUNCTION public.apply_festival_company_licence("
          )
          end = source.index("\n$$;", start) + len("\n$$;")
          function = source[start:end]
          if "  result jsonb;" in function:
              function = function.replace(
                  "  result jsonb;", "  licence_result jsonb;", 1
              )
              function = function.replace(
                  "  result := public.get_festival_company_upgrades(company.id);",
                  "  licence_result := public.get_festival_company_upgrades(company.id);",
                  1,
              )
              function = function.replace(
                  "      result = result,",
                  "      result = licence_result,",
                  1,
              )
              function = function.replace(
                  "  RETURN result;", "  RETURN licence_result;", 1
              )
              source = source[:start] + function + source[end:]
          elif "  licence_result jsonb;" not in function:
              raise SystemExit("licence result variable anchor not found")

          setup_start = source.index(
              "CREATE OR REPLACE FUNCTION public.get_festival_company_setup("
          )
          setup_end = source.index("\n$$;", setup_start) + len("\n$$;")
          setup = source[setup_start:setup_end]
          if "owner.character_name" in setup:
              setup = setup.replace(
                  "coalesce(owner.character_name, owner.username, 'Owner')",
                  "coalesce(owner.display_name, owner.username, 'Owner')",
                  1,
              )
          if "'capabilities', public.festival_company_capabilities()" not in setup:
              anchor = """    'firstEditionExists', EXISTS (
                SELECT 1 FROM public.festival_editions_v2 edition
                WHERE edition.festival_company_id = festival.id
              )
          """
              replacement = """    'firstEditionExists', EXISTS (
                SELECT 1 FROM public.festival_editions_v2 edition
                WHERE edition.festival_company_id = festival.id
              ),
              'capabilities', public.festival_company_capabilities()
          """
              if anchor not in setup:
                  raise SystemExit("Festival company setup capability anchor not found")
              setup = setup.replace(anchor, replacement, 1)
          source = source[:setup_start] + setup + source[setup_end:]
          migration.write_text(source)

          harness = Path("supabase/tests/festival_licence_completion_harness.sql")
          test_source = harness.read_text()
          if "  display_name text," not in test_source:
              test_source = test_source.replace(
                  "  character_name text,\n  username text",
                  "  character_name text,\n  display_name text,\n  username text",
                  1,
              )
          capability_stub = """CREATE FUNCTION public.festival_company_capabilities() RETURNS jsonb
          LANGUAGE sql STABLE AS $$
            SELECT jsonb_build_object(
              'newFestivalSystemEnabled', true,
              'festivalCompanyCreationEnabled', true,
              'festivalCompanyManagementEnabled', true,
              'festivalConfigurationEnabled', true,
              'companyLimit', 3
            )
          $$;
          """
          if capability_stub not in test_source:
              insertion = "CREATE FUNCTION public.finance_debit_owner("
              if insertion not in test_source:
                  raise SystemExit("harness finance function anchor not found")
              test_source = test_source.replace(
                  insertion,
                  capability_stub + insertion,
                  1,
              )
          harness.write_text(test_source)
          PY
          if git diff --quiet; then
            echo "Licence migration already fixed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            supabase/migrations/20291218245600_festival_licence_and_manager_authority.sql \
            supabase/tests/festival_licence_completion_harness.sql
          git commit -m "fix(festivals): preserve Festival home contract"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
