name: Festival PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install from package manifest without rewriting the stale lockfile
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Lint changed Festival sources
        run: >-
          npx eslint
          src/features/festival-company/__tests__/legacyFestivalGate.test.tsx
          src/features/festival-company/ui/LegacyFestivalGate.tsx
          src/features/festivals/editions/FestivalCompanyEditionsPage.tsx
          src/features/festivals/editions/repository.test.ts
          src/features/festivals/editions/repository.ts
          src/features/festivals/ui/CanonicalFestivalRoutes.tsx
          src/features/festivals/ui/FestivalEditionSections.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Run focused Festival tests
        run: >-
          npx vitest run
          src/features/festivals/editions/repository.test.ts
          src/features/festival-company/__tests__/legacyFestivalGate.test.tsx
          --pool=forks --maxWorkers=1 --minWorkers=1
      - name: Verify canonical Festival routes
        run: npm run test:festivals:routes && npm run test:festivals:route-components
      - name: Verify Festival certification inventory
        run: npm run test:festivals:active-callers
      - name: Verify migration ordering
        run: npm run verify:migration-timestamps
      - name: Build
        run: npm run build
