name: Finance A4 Verification

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/finance/**'
      - 'tests/finance/**'
      - '.github/workflows/finance-a4.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/finance/**'
      - 'tests/finance/**'

jobs:
  finance-db-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.31.8
      - name: Start clean local database
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor
      - name: Reset migration chain
        run: supabase db reset
      - name: Resolve local database URL
        run: echo "SUPABASE_DB_URL=$(supabase status -o env | sed -n 's/^DB_URL=//p' | tr -d '\"')" >> "$GITHUB_ENV"
      - name: Finance executable verification
        run: bash scripts/finance/run-a4-verification-gate.sh
