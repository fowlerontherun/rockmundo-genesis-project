name: Luthiery Phase 5

on:
  pull_request:
    paths:
      - "src/components/crafting/LuthieryShopPanel*"
      - "src/hooks/useLuthieryShops.ts"
      - "src/pages/CraftingWorkshop.tsx"
      - "supabase/migrations/*luthiery_phase5*"
      - "supabase/migrations/*luthiery_shop*"
      - "supabase/tests/luthiery_phase5_shop_harness.sql"
      - "package.json"
      - "docs/crafting/LUTHIERY_CRAFTING_PLAN.md"
      - ".github/workflows/luthiery-phase5.yml"
  push:
    branches: [main]
    paths:
      - "src/components/crafting/LuthieryShopPanel*"
      - "src/hooks/useLuthieryShops.ts"
      - "src/pages/CraftingWorkshop.tsx"
      - "supabase/migrations/*luthiery_phase5*"
      - "supabase/migrations/*luthiery_shop*"
      - "supabase/tests/luthiery_phase5_shop_harness.sql"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Verify dependency lock
        run: npm run verify:dependency-lock
      - name: Install dependencies
        run: npm ci
      - name: Focused Phase 5 tests
        run: npm run test:crafting:phase5
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:ci
      - name: Build
        run: npm run build
