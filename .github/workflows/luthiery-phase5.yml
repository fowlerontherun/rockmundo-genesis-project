name: Luthiery Phase 5

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/components/crafting/LuthieryShopPanel*"
      - "src/hooks/useLuthieryShops.ts"
      - "src/pages/CraftingWorkshop.tsx"
      - "supabase/migrations/*luthiery_phase5*"
      - "supabase/migrations/*luthiery_shop*"
      - "supabase/tests/luthiery_phase5_shop_harness.sql"
      - "package.json"
      - "docs/crafting/LUTHIERY_CRAFTING_PLAN.md"
      - ".github/workflows/luthiery-phase5.yml"
  push:
    branches: [main]
    paths:
      - "src/components/crafting/LuthieryShopPanel*"
      - "src/hooks/useLuthieryShops.ts"
      - "src/pages/CraftingWorkshop.tsx"
      - "supabase/migrations/*luthiery_phase5*"
      - "supabase/migrations/*luthiery_shop*"
      - "supabase/tests/luthiery_phase5_shop_harness.sql"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Verify dependency lock
        run: npm run verify:dependency-lock
      - name: Install dependencies
        run: npm ci
      - name: Focused Phase 5 tests
        run: npm run test:crafting:phase5
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:ci
      - name: Build
        run: npm run build


  database:
    name: Phase 5 database lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      SUPABASE_CLI_VERSION: '2.31.8'
      SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
      SUPABASE_STARTED: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify Docker
        run: |
          command -v docker
          docker info
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.31.8
      - name: Print database tool versions
        run: |
          supabase --version
          psql --version
      - name: Start local Supabase stack
        run: |
          supabase stop --no-backup || true
          supabase start
          echo "SUPABASE_STARTED=true" >> "$GITHUB_ENV"
          db_url="$(supabase status -o env | sed -n 's/^DB_URL="\(.*\)"$/\1/p')"
          test -n "$db_url"
          case "$db_url" in
            postgresql://postgres:*@127.0.0.1:54322/postgres|postgres://postgres:*@127.0.0.1:54322/postgres) ;;
            *) echo "Refusing non-disposable database URL" >&2; exit 2 ;;
          esac
          echo "SUPABASE_DB_URL=$db_url" >> "$GITHUB_ENV"
      - name: Reset migrated test database
        run: supabase db reset
      - name: Run Phase 5 marketplace database harness
        run: psql "$SUPABASE_DB_URL" -X -v ON_ERROR_STOP=1 -f supabase/tests/luthiery_phase5_shop_harness.sql
      - name: Stop local Supabase stack
        if: ${{ always() && env.SUPABASE_STARTED == 'true' }}
        run: supabase stop --no-backup
