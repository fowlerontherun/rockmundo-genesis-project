name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Print frontend tool versions
        run: |
          node --version
          npm --version
      - name: Verify dependency lock
        run: npm run verify:dependency-lock
      - name: Install dependencies
        run: npm ci
      - name: Verify dependency tree
        run: npm run verify:dependencies
      - name: Verify festival public migration dependencies
        run: node --test scripts/festivals/festival-public-migration-order.test.mjs
      - name: Verify Top of the Pops migration timestamps
        run: npm run verify:totp-migration-timestamps
      - name: Verify legacy songwriting and education migration reconciliation
        run: node --test tests/legacy-songwriting-table-reconciliation.test.mjs tests/legacy-university-schema-reconciliation.test.mjs tests/legacy-skill-books-schema-reconciliation.test.mjs tests/legacy-nightclub-schema-reconciliation.test.mjs
      # Run the focused DJ deck tests before typecheck and lint so failures in
      # unrelated systems do not mask the actual audio regression status.
      - name: DJ native deck regression tests
        run: npx vitest run src/features/nightclub-dj/djBeatLoop.test.ts src/features/nightclub-dj/djTapTempo.test.ts src/features/nightclub-dj/deckMediaClock.test.ts src/features/nightclub-dj/deckAudioLifecycle.test.ts src/features/nightclub-dj/djVolumeRamp.test.ts src/features/nightclub-dj/djHardwareControls.test.ts src/features/nightclub-dj/mixerMath.test.ts
      # Keep the interview interaction regression suite visible even when
      # unrelated global lint baselines fail later in the job.
      - name: Media interview and avatar capture regression tests
        run: npx vitest run src/data/interviewPresenters.test.ts src/data/interviewCamera.test.ts src/components/pr/InterviewerStage.test.tsx src/utils/interviewSelection.test.ts src/features/shareable-moments/avatarCaptureQueue.test.ts src/features/shareable-moments/CharacterShareStudio.test.tsx src/components/band/portraitCaptureCache.test.ts src/components/band/PortraitLineup.test.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:ci
      - name: Critical Live V1 journeys
        run: npm run test:critical-journeys -- --reporter=default
      - name: Unit tests
        run: npm run test:unit -- --reporter=default
      - name: Balance validation gate
        run: npm run validate:balance
      - name: Progression programme validation gate
        run: npm run validate:progression-programme
      - name: Build
        run: npm run build
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.31.8
      - name: Festival SQL tests
        run: npm run test:festivals:db
      - name: Top of the Pops SQL tests
        run: npm run test:totp:db
      - name: Upload Supabase logs on festival DB gate failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-logs
          path: supabase/.branches/**/logs/**
          if-no-files-found: ignore
