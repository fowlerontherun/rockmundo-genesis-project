name: CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Print frontend tool versions
        run: |
          node --version
          npm --version
      - name: Verify dependency lock
        run: npm run verify:dependency-lock
      - name: Install dependencies
        run: npm ci
      - name: Verify dependency tree
        run: npm run verify:dependencies
      - name: Verify festival public migration dependencies
        run: node --test scripts/festivals/festival-public-migration-order.test.mjs
      - name: Verify Top of the Pops migration timestamps
        run: npm run verify:totp-migration-timestamps
      - name: Verify Avatar V2 Blender helpers
        run: npm run verify:avatar-v2-blender-scripts
      - name: Test Avatar V2 binary GLB skinning and malformed exports
        run: python3 -m unittest discover -s scripts/avatar-v2/tests -p test_verify_skinned_glb.py -v
      - name: Verify Avatar V2 asset contract
        run: npm run validate:avatar-v2
      - name: Verify Avatar V2 binary production manifest and signed QA evidence
        run: python3 scripts/avatar-v2/validate_production_glbs.py
      - name: Test production asset quarantine and status promotion rules
        run: python3 -m unittest discover -s scripts/avatar-v2/tests -p test_validate_production_glbs.py -v
      - name: Avatar V2 regression tests
        run: npm run test:avatar-v2
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:ci
      - name: Critical beta journeys
        run: npm run test:critical-journeys -- --reporter=default
      - name: Unit tests
        run: npm run test:unit -- --reporter=default
      - name: Balance validation gate
        run: npm run validate:balance
      - name: Progression programme validation gate
        run: npm run validate:progression-programme
      - name: Build
        run: npm run build
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.31.8
      - name: Festival SQL tests
        run: npm run test:festivals:db
      - name: Top of the Pops SQL tests
        run: npm run test:totp:db
      - name: Upload Supabase logs on festival DB gate failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-logs
          path: supabase/.branches/**/logs/**
          if-no-files-found: ignore
