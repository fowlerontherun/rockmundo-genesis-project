name: Festival edition projection alias edit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Rename reserved SQL aliases
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          migration = Path("supabase/migrations/20291218245500_festival_edition_internal_projections.sql")
          sql = migration.read_text()
          sql = re.sub(
              r"(?:application_)+window_payload",
              "application_window_payload",
              sql,
          )
          sql = re.sub(
              r"(?:application_)+window",
              "application_window",
              sql,
          )
          sql = sql.replace(
              "  window jsonb;",
              "  application_window_payload jsonb;",
          )
          sql = sql.replace(
              "  window := p_application_windows->0;",
              "  application_window_payload := p_application_windows->0;",
          )
          sql = re.sub(r"\bwindow->", "application_window_payload->", sql)
          sql = re.sub(r"\bwindow\.", "application_window.", sql)
          sql = re.sub(
              r"FROM public\.festival_artist_application_windows\s+window\b",
              "FROM public.festival_artist_application_windows application_window",
              sql,
          )
          if "application_application" in sql:
              raise SystemExit("duplicated application alias remains")
          if re.search(r"festival_artist_application_windows\s+window\b", sql):
              raise SystemExit("reserved table alias remains")
          if re.search(r"^\s*window jsonb;", sql, re.MULTILINE):
              raise SystemExit("reserved payload variable remains")
          migration.write_text(sql)
          PY
          if git diff --quiet -- supabase/migrations/20291218245500_festival_edition_internal_projections.sql; then
            echo "Projection SQL aliases already safe."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20291218245500_festival_edition_internal_projections.sql
          git commit -m "Canonicalise Festival projection aliases"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
