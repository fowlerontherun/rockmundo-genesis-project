name: Festival edition projection alias edit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Rename reserved SQL aliases
        run: |
          python3 - <<'PY'
          from pathlib import Path

          migration = Path("supabase/migrations/20291218245500_festival_edition_internal_projections.sql")
          sql = migration.read_text()
          sql = sql.replace(
              "  window jsonb;",
              "  application_window_payload jsonb;",
          )
          sql = sql.replace(
              "  window := p_application_windows->0;",
              "  application_window_payload := p_application_windows->0;",
          )
          sql = sql.replace("window->", "application_window_payload->")
          sql = sql.replace("window.", "application_window.")
          sql = sql.replace(
              "FROM public.festival_artist_application_windows window",
              "FROM public.festival_artist_application_windows application_window",
          )
          if " festival_artist_application_windows window" in sql or " window jsonb;" in sql:
              raise SystemExit("reserved window identifier remains")
          migration.write_text(sql)
          PY
          if git diff --quiet -- supabase/migrations/20291218245500_festival_edition_internal_projections.sql; then
            echo "Projection SQL aliases already safe."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20291218245500_festival_edition_internal_projections.sql
          git commit -m "Rename reserved Festival projection aliases"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
