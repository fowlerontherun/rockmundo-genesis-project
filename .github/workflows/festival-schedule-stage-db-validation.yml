name: Festival schedule stage DB validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - name: Create annual-edition scheduling contract schema
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE SCHEMA auth;
          CREATE EXTENSION IF NOT EXISTS pgcrypto;
          CREATE TYPE public.app_role AS ENUM ('admin', 'user');
          CREATE TYPE public.festival_edition_status AS ENUM (
            'concept','planning','applications_open','booking','announced','on_sale','setup','live','settling','completed','postponed','cancelled','abandoned'
          );
          CREATE FUNCTION auth.uid() RETURNS uuid LANGUAGE sql STABLE
            AS $$ SELECT nullif(current_setting('request.jwt.claim.sub', true), '')::uuid $$;
          CREATE FUNCTION public.current_profile_id_safe() RETURNS uuid LANGUAGE sql STABLE
            AS $$ SELECT auth.uid() $$;
          CREATE FUNCTION public.is_admin(uuid) RETURNS boolean LANGUAGE sql STABLE
            AS $$ SELECT false $$;

          CREATE TABLE public.profiles(id uuid PRIMARY KEY);
          CREATE TABLE public.companies(id uuid PRIMARY KEY);
          CREATE TABLE public.cities(id uuid PRIMARY KEY, timezone text);
          CREATE TABLE public.festivals(
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(), name text NOT NULL,
            city_id uuid NOT NULL REFERENCES public.cities(id), start_date date NOT NULL,
            end_date date NOT NULL, expected_attendance integer,
            metadata jsonb NOT NULL DEFAULT '{}', owner_type text NOT NULL DEFAULT 'system',
            owner_profile_id uuid, owner_company_id uuid
          );
          CREATE TABLE public.festival_editions(
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            festival_id uuid NOT NULL REFERENCES public.festivals(id),
            edition_number integer NOT NULL, edition_year integer, title text,
            city_id uuid REFERENCES public.cities(id), start_at timestamptz,
            end_at timestamptz, timezone text NOT NULL DEFAULT 'UTC',
            time_zone text NOT NULL DEFAULT 'UTC', expected_attendance integer,
            capacity integer, status public.festival_edition_status NOT NULL DEFAULT 'planning',
            legacy_metadata jsonb NOT NULL DEFAULT '{}', created_by uuid REFERENCES public.profiles(id),
            UNIQUE(festival_id, edition_number)
          );
          CREATE TABLE public.festival_companies(
            id uuid PRIMARY KEY, company_id uuid NOT NULL REFERENCES public.companies(id),
            owner_profile_id uuid NOT NULL REFERENCES public.profiles(id),
            public_name text NOT NULL, default_city_id uuid REFERENCES public.cities(id)
          );
          CREATE TABLE public.festival_editions_v2(
            id uuid PRIMARY KEY, festival_company_id uuid NOT NULL REFERENCES public.festival_companies(id),
            edition_year integer NOT NULL, name text NOT NULL, status text NOT NULL,
            starts_on date, ends_on date, city_id uuid REFERENCES public.cities(id),
            expected_capacity integer
          );
          CREATE TABLE public.festival_legacy_mappings(
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            edition_id uuid NOT NULL REFERENCES public.festival_editions(id),
            legacy_source text NOT NULL, legacy_id uuid NOT NULL,
            legacy_festival_id uuid, created_at timestamptz NOT NULL DEFAULT now(),
            metadata jsonb NOT NULL DEFAULT '{}', UNIQUE(legacy_source, legacy_id)
          );
          CREATE TABLE public.festival_public_legacy_bridges(
            legacy_festival_id uuid NOT NULL,
            festival_company_id uuid REFERENCES public.festival_companies(id),
            festival_edition_id uuid REFERENCES public.festival_editions_v2(id),
            provenance text NOT NULL DEFAULT 'admin_repair', created_at timestamptz NOT NULL DEFAULT now(),
            PRIMARY KEY(legacy_festival_id, festival_company_id, festival_edition_id)
          );

          CREATE TABLE public.festival_site_plans(
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            festival_company_id uuid NOT NULL REFERENCES public.festival_companies(id),
            festival_edition_id uuid REFERENCES public.festival_editions_v2(id)
          );
          CREATE TABLE public.festival_site_plan_stages(
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            festival_site_plan_id uuid NOT NULL REFERENCES public.festival_site_plans(id),
            festival_company_id uuid NOT NULL REFERENCES public.festival_companies(id),
            name text NOT NULL, slug text NOT NULL, stage_type text NOT NULL,
            sort_order smallint NOT NULL, capacity integer NOT NULL,
            minimum_artist_fame integer, performance_area_quality smallint,
            sound_quality smallint, lighting_quality smallint,
            production_complexity text NOT NULL DEFAULT 'standard',
            indoor boolean NOT NULL, covered boolean NOT NULL,
            accessible_viewing_capacity integer NOT NULL DEFAULT 0,
            opens_at time NOT NULL, closes_at time NOT NULL,
            changeover_minutes smallint NOT NULL, headline_slot_minutes smallint NOT NULL,
            standard_slot_minutes smallint NOT NULL, status text NOT NULL DEFAULT 'planned'
          );
          CREATE TABLE public.festival_stages(
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            festival_id uuid NOT NULL REFERENCES public.festivals(id),
            edition_id uuid NOT NULL REFERENCES public.festival_editions(id),
            stage_name text NOT NULL, public_name text, stage_number integer NOT NULL,
            stage_type text NOT NULL, capacity integer NOT NULL,
            stage_size text, sound_capability text, lighting_capability text,
            weather_protection text, default_changeover_minutes integer NOT NULL DEFAULT 30,
            curfew_time time, technical_metadata jsonb NOT NULL DEFAULT '{}',
            public_metadata jsonb NOT NULL DEFAULT '{}', idempotency_key text,
            created_by uuid, archived_at timestamptz, updated_at timestamptz NOT NULL DEFAULT now(),
            UNIQUE(edition_id, idempotency_key)
          );
          CREATE TABLE public.festival_stage_operating_hours(
            id uuid PRIMARY KEY DEFAULT gen_random_uuid(),
            festival_id uuid NOT NULL REFERENCES public.festivals(id),
            edition_id uuid NOT NULL REFERENCES public.festival_editions(id),
            stage_id uuid NOT NULL REFERENCES public.festival_stages(id),
            festival_date date NOT NULL, opens_at timestamptz NOT NULL,
            curfew_at timestamptz NOT NULL, shutdown_buffer_minutes integer NOT NULL DEFAULT 0,
            default_changeover_minutes integer NOT NULL DEFAULT 30,
            UNIQUE(stage_id, festival_date)
          );

          CREATE FUNCTION public.create_festival_edition_stage(
            p_edition_id uuid, p_name text, p_type text DEFAULT 'main', p_capacity integer DEFAULT 0,
            p_genre_focus text DEFAULT NULL, p_stage_size text DEFAULT NULL,
            p_sound_capability text DEFAULT NULL, p_lighting_capability text DEFAULT NULL,
            p_backstage_capability text DEFAULT NULL, p_weather_protection text DEFAULT NULL,
            p_changeover_duration integer DEFAULT 30, p_curfew time DEFAULT NULL,
            p_technical_metadata jsonb DEFAULT '{}'::jsonb,
            p_public_metadata jsonb DEFAULT '{}'::jsonb, p_idempotency_key text DEFAULT NULL
          ) RETURNS jsonb LANGUAGE plpgsql SECURITY DEFINER SET search_path=public AS $$
          DECLARE target public.festival_stages%ROWTYPE; festival uuid;
          BEGIN
            SELECT festival_id INTO festival FROM public.festival_editions WHERE id=p_edition_id;
            SELECT * INTO target FROM public.festival_stages
              WHERE edition_id=p_edition_id AND idempotency_key=p_idempotency_key;
            IF FOUND THEN RETURN to_jsonb(target); END IF;
            INSERT INTO public.festival_stages(
              festival_id, edition_id, stage_name, public_name, stage_number,
              stage_type, capacity, stage_size, sound_capability, lighting_capability,
              weather_protection, default_changeover_minutes, curfew_time,
              technical_metadata, public_metadata, idempotency_key, created_by
            ) VALUES (
              festival, p_edition_id, p_name, p_name,
              coalesce((SELECT max(stage_number)+1 FROM public.festival_stages WHERE edition_id=p_edition_id),1),
              p_type, p_capacity, p_stage_size, p_sound_capability, p_lighting_capability,
              p_weather_protection, p_changeover_duration, p_curfew,
              p_technical_metadata, p_public_metadata, p_idempotency_key, auth.uid()
            ) RETURNING * INTO target;
            RETURN to_jsonb(target);
          END $$;

          CREATE FUNCTION public.festival_schedule_configure_stage_hours(
            p_edition_id uuid, p_stage_id uuid, p_festival_date date,
            p_opening_time time, p_curfew time,
            p_shutdown_buffer_minutes integer DEFAULT 0,
            p_changeover_minutes integer DEFAULT 30,
            p_idempotency_key text DEFAULT NULL
          ) RETURNS jsonb LANGUAGE plpgsql SECURITY DEFINER SET search_path=public AS $$
          DECLARE edition public.festival_editions%ROWTYPE; opening timestamptz; curfew timestamptz;
          BEGIN
            SELECT * INTO edition FROM public.festival_editions WHERE id=p_edition_id;
            opening := (p_festival_date::text||' '||p_opening_time::text)::timestamp AT TIME ZONE edition.time_zone;
            curfew := (p_festival_date::text||' '||p_curfew::text)::timestamp AT TIME ZONE edition.time_zone;
            IF curfew <= opening THEN curfew := curfew + interval '1 day'; END IF;
            INSERT INTO public.festival_stage_operating_hours(
              festival_id,edition_id,stage_id,festival_date,opens_at,curfew_at,
              shutdown_buffer_minutes,default_changeover_minutes
            ) VALUES (
              edition.festival_id,edition.id,p_stage_id,p_festival_date,opening,curfew,
              p_shutdown_buffer_minutes,p_changeover_minutes
            ) ON CONFLICT(stage_id,festival_date) DO UPDATE SET
              opens_at=excluded.opens_at,curfew_at=excluded.curfew_at;
            RETURN jsonb_build_object('stageId',p_stage_id,'festivalDate',p_festival_date);
          END $$;
          SQL
      - name: Apply schedule bridge and stage projection migrations
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20291218245100_festival_v2_schedule_bridge.sql
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -f supabase/migrations/20291218245200_festival_v2_schedule_stage_sync.sql
      - name: Exercise bound-stage projection without overwriting schedule hours
        run: |
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO public.profiles VALUES ('aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa');
          INSERT INTO public.companies VALUES ('bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb');
          INSERT INTO public.cities VALUES ('cccccccc-cccc-4ccc-8ccc-cccccccccccc','Europe/London');
          INSERT INTO public.festival_companies VALUES (
            'dddddddd-dddd-4ddd-8ddd-dddddddddddd',
            'bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb',
            'aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',
            'Stage Sync Festival','cccccccc-cccc-4ccc-8ccc-cccccccccccc'
          );
          INSERT INTO public.festival_editions_v2 VALUES (
            'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee',
            'dddddddd-dddd-4ddd-8ddd-dddddddddddd',
            5,'Stage Sync Festival 5','draft','2030-06-01','2030-06-02',
            'cccccccc-cccc-4ccc-8ccc-cccccccccccc',5000
          );
          INSERT INTO public.festival_site_plans(id,festival_company_id,festival_edition_id) VALUES (
            '11111111-1111-4111-8111-111111111111',
            'dddddddd-dddd-4ddd-8ddd-dddddddddddd',
            'eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee'
          );
          INSERT INTO public.festival_site_plan_stages(
            id,festival_site_plan_id,festival_company_id,name,slug,stage_type,sort_order,
            capacity,minimum_artist_fame,performance_area_quality,sound_quality,lighting_quality,
            production_complexity,indoor,covered,accessible_viewing_capacity,opens_at,closes_at,
            changeover_minutes,headline_slot_minutes,standard_slot_minutes,status
          ) VALUES (
            '22222222-2222-4222-8222-222222222222',
            '11111111-1111-4111-8111-111111111111',
            'dddddddd-dddd-4ddd-8ddd-dddddddddddd',
            'Main Stage','main-stage','main',0,5000,100,80,75,70,'large',false,true,50,
            '12:00','23:00',30,90,45,'ready'
          );

          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',false);
          SELECT public.ensure_festival_v2_schedule_workspace('eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee');
          RESET ROLE;

          DO $$
          DECLARE target uuid; original_open timestamptz;
          BEGIN
            SELECT id INTO target FROM public.festival_stages
              WHERE idempotency_key='v2-site-stage:22222222-2222-4222-8222-222222222222';
            IF target IS NULL THEN RAISE EXCEPTION 'bound site-plan stage was not projected'; END IF;
            IF (SELECT count(*) FROM public.festival_stage_operating_hours WHERE stage_id=target) <> 2 THEN
              RAISE EXCEPTION 'operating hours were not seeded for every Festival date';
            END IF;
            SELECT opens_at INTO original_open FROM public.festival_stage_operating_hours
              WHERE stage_id=target AND festival_date='2030-06-01';
            UPDATE public.festival_stage_operating_hours SET opens_at=opens_at+interval '1 hour'
              WHERE stage_id=target AND festival_date='2030-06-01';
            UPDATE public.festival_site_plan_stages SET name='Renamed Main Stage',capacity=4500
              WHERE id='22222222-2222-4222-8222-222222222222';
          END $$;

          SET ROLE authenticated;
          SELECT set_config('request.jwt.claim.sub','aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa',false);
          SELECT public.ensure_festival_v2_schedule_workspace('eeeeeeee-eeee-4eee-8eee-eeeeeeeeeeee');
          RESET ROLE;

          DO $$
          DECLARE target uuid;
          BEGIN
            SELECT id INTO target FROM public.festival_stages
              WHERE idempotency_key='v2-site-stage:22222222-2222-4222-8222-222222222222';
            IF (SELECT count(*) FROM public.festival_stages WHERE edition_id=(SELECT schedule_edition_id FROM public.festival_v2_schedule_bridges LIMIT 1)) <> 1 THEN
              RAISE EXCEPTION 'stage projection was not idempotent';
            END IF;
            IF (SELECT stage_name FROM public.festival_stages WHERE id=target) <> 'Renamed Main Stage'
               OR (SELECT capacity FROM public.festival_stages WHERE id=target) <> 4500 THEN
              RAISE EXCEPTION 'stage planning changes were not projected';
            END IF;
            IF (SELECT count(*) FROM public.festival_stage_operating_hours WHERE stage_id=target) <> 2 THEN
              RAISE EXCEPTION 'operating hours were duplicated';
            END IF;
            IF (SELECT extract(hour FROM opens_at AT TIME ZONE 'Europe/London') FROM public.festival_stage_operating_hours WHERE stage_id=target AND festival_date='2030-06-01') <> 13 THEN
              RAISE EXCEPTION 'existing schedule-specific operating hours were overwritten';
            END IF;
          END $$;
          SQL
