name: Luthiery Phase 4

on:
  pull_request:
    paths:
      - "src/components/crafting/**"
      - "src/data/luthieryWorkbench*"
      - "src/hooks/useCraftingSystem.ts"
      - "src/pages/CraftingWorkshop.tsx"
      - "supabase/migrations/*luthiery_phase4*"
      - "supabase/tests/luthiery_phase4_authoritative_harness.sql"
      - "tests/gig-experience/luthiery-workbench.spec.ts"
      - "package.json"
      - "docs/crafting/LUTHIERY_CRAFTING_PLAN.md"
      - ".github/workflows/luthiery-phase4.yml"
  push:
    branches: [main]
    paths:
      - "src/components/crafting/**"
      - "src/data/luthieryWorkbench*"
      - "src/hooks/useCraftingSystem.ts"
      - "src/pages/CraftingWorkshop.tsx"
      - "supabase/migrations/*luthiery_phase4*"
      - "supabase/tests/luthiery_phase4_authoritative_harness.sql"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Verify dependency lock
        run: npm run verify:dependency-lock
      - name: Install dependencies
        run: npm ci
      - name: Focused Phase 4 tests
        run: npm run test:crafting:phase4
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:ci
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Workbench browser journey
        run: npm run test:crafting:phase3:e2e
      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: luthiery-phase4-playwright
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
