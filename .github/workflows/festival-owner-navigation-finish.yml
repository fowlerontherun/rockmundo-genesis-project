name: Finish Festival owner navigation

on:
  pull_request:
    paths:
      - '.github/workflows/festival-owner-navigation-finish.yml'

permissions:
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm ci
      - name: Finish owner management navigation
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text()
              if old not in text:
                  raise SystemExit(f"Expected patch anchor missing in {path}: {old[:80]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"Patch anchor is not unique in {path}: {old[:80]!r}")
              target.write_text(text.replace(old, new, 1))

          routes_path = "src/features/festivals/ui/CanonicalFestivalRoutes.tsx"
          replace_once(
              routes_path,
              '} from "./FestivalEditionSections";\n',
              '} from "./FestivalEditionSections";\nimport { FestivalOwnerNavigation } from "./FestivalOwnerNavigation";\n',
          )
          replace_once(
              routes_path,
              '      </header>\n\n      <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-5">',
              '      </header>\n\n      <FestivalOwnerNavigation\n        festivalCompanyId={festivalCompanyId}\n        currentEditionId={currentAnnualFestival?.festivalEditionId ?? null}\n      />\n\n      <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-5">',
          )
          replace_once(
              routes_path,
              '''      <div className="flex flex-wrap gap-3">\n        <Link\n          className="underline"\n          to={festivalRoutes.genericCompany(festival.companyId)}\n        >\n          Company finances and staff\n        </Link>\n        {festival.setupCompleted ? (\n          <Link\n            className="underline"\n            to={festivalRoutes.editions(festival.festivalCompanyId)}\n          >\n            Annual Festivals\n          </Link>\n        ) : null}\n        <Link\n          className="underline"\n          to={festivalRoutes.upgrades(festival.festivalCompanyId)}\n        >\n          Festival upgrades\n        </Link>\n      </div>\n\n''',
              '',
          )
          replace_once(
              routes_path,
              '''      </header>\n\n      <nav\n        className="-mx-1 flex gap-1 overflow-x-auto pb-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"\n        aria-label="Annual Festival navigation"''',
              '''      </header>\n\n      <FestivalOwnerNavigation\n        festivalCompanyId={festivalCompanyId!}\n        currentEditionId={editionId!}\n      />\n\n      <nav\n        className="-mx-1 flex gap-1 overflow-x-auto pb-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden"\n        aria-label="Annual Festival navigation"''',
          )

          nav_path = "src/features/festivals/ui/FestivalOwnerNavigation.tsx"
          replace_once(
              nav_path,
              '''  const editableEditionId =\n    currentEditionId ??\n    editionsQuery.data?.editions\n      .filter((edition) => edition.editable)\n      .sort((left, right) => left.editionYear - right.editionYear)[0]\n      ?.festivalEditionId ??\n    null;''',
              '''  const currentEditionIsEditable = Boolean(\n    currentEditionId &&\n      editionsQuery.data?.editions.some(\n        (edition) =>\n          edition.editable && edition.festivalEditionId === currentEditionId,\n      ),\n  );\n  const editableEditionId =\n    (currentEditionIsEditable ? currentEditionId : null) ??\n    editionsQuery.data?.editions\n      .filter((edition) => edition.editable)\n      .sort((left, right) => left.editionYear - right.editionYear)[0]\n      ?.festivalEditionId ??\n    null;''',
          )

          replace_once(
              "src/features/festivals/ui/simplifiedFestivalArtistFlow.test.ts",
              'edition.editable ? "Plan Festival" : "View result"',
              'edition.editable ? "Continue Festival" : "View result"',
          )

          Path("src/features/festivals/ui/FestivalOwnerNavigation.contract.test.ts").write_text('''import { readFileSync } from "node:fs";\nimport { resolve } from "node:path";\nimport { describe, expect, it } from "vitest";\n\nconst source = (path: string) => readFileSync(resolve(process.cwd(), path), "utf8");\n\ndescribe("Festival owner management navigation", () => {\n  it("keeps one persistent company-management strip across owner surfaces", () => {\n    const navigation = source("src/features/festivals/ui/FestivalOwnerNavigation.tsx");\n    const routes = source("src/features/festivals/ui/CanonicalFestivalRoutes.tsx");\n    const editions = source("src/features/festivals/editions/FestivalCompanyEditionsPage.tsx");\n    const upgrades = source("src/features/festival-company/upgrades/FestivalUpgradeWorkspace.tsx");\n\n    for (const label of [\n      "Overview",\n      "Current Festival",\n      "Upgrades & licence",\n      "Festival history",\n      "Company finances",\n    ]) {\n      expect(navigation).toContain(label);\n    }\n\n    expect(routes.match(/<FestivalOwnerNavigation/g)?.length ?? 0).toBeGreaterThanOrEqual(2);\n    expect(editions).toContain("<FestivalOwnerNavigation");\n    expect(upgrades).toContain("<FestivalOwnerNavigation");\n    expect(editions).toContain("Continue Festival");\n    expect(editions).toContain('id="festival-history"');\n  });\n\n  it("never treats a historical result as the current editable Festival", () => {\n    const navigation = source("src/features/festivals/ui/FestivalOwnerNavigation.tsx");\n    expect(navigation).toContain("currentEditionIsEditable");\n    expect(navigation).toContain("edition.editable && edition.festivalEditionId === currentEditionId");\n  });\n});\n''')
          PY
      - name: Refresh active Festival inventory
        run: node scripts/festivals/certify-active-system.mjs
      - name: Validate Festival owner navigation
        run: |
          npm run test:festivals
          npm run test:festivals:active-callers
          npm run typecheck
      - name: Commit finished owner navigation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/festivals/ui/CanonicalFestivalRoutes.tsx \
            src/features/festivals/ui/FestivalOwnerNavigation.tsx \
            src/features/festivals/ui/FestivalOwnerNavigation.contract.test.ts \
            src/features/festivals/ui/simplifiedFestivalArtistFlow.test.ts \
            docs/festivals/festival-active-callers.json
          if git diff --cached --quiet; then
            echo "Owner navigation already finished."
            exit 0
          fi
          git commit -m "feat(festivals): unify owner management navigation"
          git push origin "HEAD:${{ github.head_ref }}"
