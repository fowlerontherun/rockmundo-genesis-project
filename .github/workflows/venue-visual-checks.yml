name: Venue visual regression checks

on:
  pull_request:
    paths:
      - "src/features/gig-demo-3d/venueProduction*"
      - "src/features/gig-demo-3d/venueLightShow*"
      - "src/features/gig-demo-3d/venueMotorizedFixtures*"
      - "src/features/gig-demo-3d/ConcertScene.ts"
      - "src/features/gig-demo-3d/venueShowIdentity*"
      - "src/features/gig-demo-3d/venueScreenGraphics*"
      - "src/features/gig-demo-3d/venueVideoRigging*"
      - "src/features/gig-demo-3d/venueStageAccess*"
      - "src/features/gig-demo-3d/venueSpeakerArray*"
      - "src/features/gig-demo-3d/venueCameraAngles*"
      - "src/features/gig-demo-3d/gigCameraSequence*"
      - "src/features/gig-demo-3d/config.ts"
      - "src/features/gig-demo-3d/venueSurfaceMaterials*"
      - "src/features/gig-demo-3d/venueProfile.ts"
      - ".github/workflows/venue-visual-checks.yml"
  push:
    branches: [main]
    paths:
      - "src/features/gig-demo-3d/venueProduction*"
      - "src/features/gig-demo-3d/venueLightShow*"
      - "src/features/gig-demo-3d/venueMotorizedFixtures*"
      - "src/features/gig-demo-3d/ConcertScene.ts"
      - "src/features/gig-demo-3d/venueShowIdentity*"
      - "src/features/gig-demo-3d/venueScreenGraphics*"
      - "src/features/gig-demo-3d/venueVideoRigging*"
      - "src/features/gig-demo-3d/venueStageAccess*"
      - "src/features/gig-demo-3d/venueSpeakerArray*"
      - "src/features/gig-demo-3d/venueCameraAngles*"
      - "src/features/gig-demo-3d/gigCameraSequence*"
      - "src/features/gig-demo-3d/config.ts"
      - "src/features/gig-demo-3d/venueSurfaceMaterials*"
      - "src/features/gig-demo-3d/venueProfile.ts"
      - ".github/workflows/venue-visual-checks.yml"

jobs:
  venue-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Verify venue materials and capacity-tier production geometry
        run: npx vitest run src/features/gig-demo-3d/venueProduction.test.ts src/features/gig-demo-3d/venueSurfaceMaterials.test.ts src/features/gig-demo-3d/venueShowIdentity.test.ts src/features/gig-demo-3d/venueScreenGraphics.test.ts src/features/gig-demo-3d/venueLightShow.test.ts src/features/gig-demo-3d/venueMotorizedFixtures.test.ts src/features/gig-demo-3d/venueVideoRigging.test.ts src/features/gig-demo-3d/venueStageAccess.test.ts src/features/gig-demo-3d/venueSpeakerArray.test.ts src/features/gig-demo-3d/venueCameraAngles.test.ts src/features/gig-demo-3d/gigCameraSequence.test.ts src/features/gig-demo-3d/venueCamera.test.ts src/features/gig-demo-3d/gigCameraSequence.test.ts
      - name: Typecheck venue production against the actual frontend build
        run: npm run typecheck
