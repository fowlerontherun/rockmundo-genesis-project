name: Festival schedule validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install without rewriting the stale repository lockfile
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund --legacy-peer-deps
      - name: Lint changed Festival scheduling sources
        run: >-
          npx eslint
          src/features/festivals/scheduling/model.ts
          src/features/festivals/scheduling/service.ts
          src/features/festivals/scheduling/time.ts
          src/features/festivals/scheduling/time.test.ts
          src/features/festivals/scheduling/components/FestivalScheduleWorkspace.tsx
          src/features/festivals/scheduling/components/FestivalScheduleWorkspace.test.tsx
      - name: Typecheck
        run: npm run typecheck
      - name: Run focused Festival scheduling tests
        run: >-
          npx vitest run
          src/features/festivals/scheduling/time.test.ts
          src/features/festivals/scheduling/components/FestivalScheduleWorkspace.test.tsx
          --pool=forks --maxWorkers=1 --minWorkers=1
      - name: Verify Festival routes
        run: npm run test:festivals:routes && npm run test:festivals:route-components
      - name: Verify Festival active-system inventory
        run: npm run test:festivals:active-callers
      - name: Build
        run: npm run build
