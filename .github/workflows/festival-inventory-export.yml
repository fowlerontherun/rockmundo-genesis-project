name: Festival inventory export

on:
  pull_request:
    paths:
      - '.github/workflows/festival-inventory-export.yml'
      - 'scripts/festivals/**'
      - 'src/features/festival-company/**'
      - 'src/features/festivals/**'
      - 'src/App.tsx'

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm ci
      - name: Generate Festival active-caller inventory
        run: node scripts/festivals/certify-active-system.mjs
      - name: Upload generated inventory
        uses: actions/upload-artifact@v4
        with:
          name: festival-active-callers
          path: docs/festivals/festival-active-callers.json
          if-no-files-found: error
          retention-days: 1
