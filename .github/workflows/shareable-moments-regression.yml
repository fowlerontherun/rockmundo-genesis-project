name: Shareable Moments Regression Gate

concurrency:
  group: shareable-moments-regression-${{ github.event_name }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/features/shareable-moments/**"
      - "src/pages/ShareStudio.tsx"
      - "src/pages/Dashboard.tsx"
      - "src/config/fmNavigation.ts"
      - "src/config/hubNavigation.ts"
      - "src/mobile/shell/FabMenu.tsx"
      - "docs/social/SHAREABLE_MOMENTS_PLAN.md"
      - ".github/workflows/shareable-moments-regression.yml"
  push:
    branches: [main]
    paths:
      - "src/features/shareable-moments/**"
      - "src/pages/ShareStudio.tsx"
      - "src/pages/Dashboard.tsx"
      - "src/config/fmNavigation.ts"
      - "src/config/hubNavigation.ts"
      - "src/mobile/shell/FabMenu.tsx"
      - "docs/social/SHAREABLE_MOMENTS_PLAN.md"
      - ".github/workflows/shareable-moments-regression.yml"

jobs:
  share:
    name: Shareable Moments focused regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm ci
      - name: Shareable Moments focused tests
        run: >
          npx vitest run
          src/features/shareable-moments/shareableMoments.test.ts
          src/features/shareable-moments/referralAttribution.test.ts
          src/features/shareable-moments/referralDestination.test.ts
          src/features/shareable-moments/ShareMomentSheet.test.tsx\n          src/features/shareable-moments/shareEntrypoints.contract.test.ts
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
