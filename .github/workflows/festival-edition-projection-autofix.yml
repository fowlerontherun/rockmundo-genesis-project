name: Festival edition projection edit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Wire exact annual edition into simplified screens
        run: |
          python3 - <<'PY'
          from pathlib import Path

          ticket = Path("src/features/festival-company/ui/FestivalTicketPlanner.tsx")
          source = ticket.read_text()
          old = '''export function FestivalTicketPlanner({
            festivalCompanyId,
          }: {
            festivalCompanyId: string;
          }) {
            const site = useFestivalSitePlan(festivalCompanyId);
            const query = useFestivalTicketPlan(
              festivalCompanyId,
              site.data?.ready === true,
            );'''
          new = '''export function FestivalTicketPlanner({
            festivalCompanyId,
            festivalEditionId,
          }: {
            festivalCompanyId: string;
            festivalEditionId?: string;
          }) {
            const site = useFestivalSitePlan(festivalCompanyId, festivalEditionId);
            const query = useFestivalTicketPlan(
              festivalCompanyId,
              festivalEditionId,
              site.data?.ready === true,
            );'''
          if old in source:
              source = source.replace(old, new)
          elif new not in source:
              raise SystemExit("FestivalTicketPlanner signature marker missing")
          old_mutation = '''      {
                festivalCompanyId,
                expectedVersion: data.planningVersion,'''
          new_mutation = '''      {
                festivalCompanyId,
                festivalEditionId,
                expectedVersion: data.planningVersion,'''
          if old_mutation in source:
              source = source.replace(old_mutation, new_mutation, 1)
          elif new_mutation not in source:
              raise SystemExit("FestivalTicketPlanner mutation marker missing")
          ticket.write_text(source)

          artist = Path("src/features/festival-company/ui/FestivalArtistPlanner.tsx")
          source = artist.read_text()
          old = '''export function FestivalArtistPlanner({
            festivalCompanyId,
          }: {
            festivalCompanyId: string;
          }) {
            const query = useFestivalArtistProgramme(festivalCompanyId);'''
          new = '''export function FestivalArtistPlanner({
            festivalCompanyId,
            festivalEditionId,
          }: {
            festivalCompanyId: string;
            festivalEditionId?: string;
          }) {
            const query = useFestivalArtistProgramme(
              festivalCompanyId,
              festivalEditionId,
            );'''
          if old in source:
              source = source.replace(old, new)
          elif new not in source:
              raise SystemExit("FestivalArtistPlanner signature marker missing")
          old_mutation = '''    save.mutate({
              festivalCompanyId,
              expectedVersion: data.planningVersion,'''
          new_mutation = '''    save.mutate({
              festivalCompanyId,
              festivalEditionId,
              expectedVersion: data.planningVersion,'''
          if old_mutation in source:
              source = source.replace(old_mutation, new_mutation, 1)
          elif new_mutation not in source:
              raise SystemExit("FestivalArtistPlanner mutation marker missing")
          artist.write_text(source)

          sections = Path("src/features/festivals/ui/FestivalEditionSections.tsx")
          source = sections.read_text()
          source = source.replace(
              '<FestivalArtistPlanner festivalCompanyId={festivalCompanyId} />',
              '''<FestivalArtistPlanner
                  festivalCompanyId={festivalCompanyId}
                  festivalEditionId={editionId}
                />''',
          )
          source = source.replace(
              '<FestivalTicketPlanner festivalCompanyId={festivalCompanyId} />',
              '''<FestivalTicketPlanner
                  festivalCompanyId={festivalCompanyId}
                  festivalEditionId={editionId}
                />''',
          )
          if source.count("festivalEditionId={editionId}") < 2:
              raise SystemExit("FestivalEditionSections edition wiring missing")
          sections.write_text(source)
          PY
          if git diff --quiet -- \
            src/features/festival-company/ui/FestivalTicketPlanner.tsx \
            src/features/festival-company/ui/FestivalArtistPlanner.tsx \
            src/features/festivals/ui/FestivalEditionSections.tsx; then
            echo "Exact-edition screen wiring already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/features/festival-company/ui/FestivalTicketPlanner.tsx \
            src/features/festival-company/ui/FestivalArtistPlanner.tsx \
            src/features/festivals/ui/FestivalEditionSections.tsx
          git commit -m "Wire tickets and line-up to annual Festival editions"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
