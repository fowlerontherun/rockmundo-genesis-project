name: Education UX checks

on:
  pull_request:
    paths:
      - 'src/features/education/**'
      - 'src/mobile/**'
      - 'src/App.tsx'
      - 'src/pages/Education.tsx'
      - 'src/pages/UniversityDetail.tsx'
      - 'src/pages/SkillsPage.tsx'
      - 'src/components/SkillTree.tsx'
      - '.github/workflows/education-ux-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  education-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Education-focused unit tests
        run: npx vitest run src/features/education/utils/educationVisibility.test.ts src/features/education/utils/educationRecommendations.test.ts src/features/education/utils/educationSkillFocus.test.ts src/features/education/utils/educationSkillCaps.test.ts src/features/education/utils/educationDailyStatus.test.ts src/features/education/utils/educationMethodChoice.test.ts
      - name: Mobile education and account navigation tests
        run: npx vitest run src/mobile/routeBridge.test.ts src/mobile/routeRegistry.test.ts src/mobile/pages/MobileEducation.test.tsx src/mobile/shell/MobileShell.test.tsx src/mobile/shell/TopAppBar.test.tsx
      - name: Production bundle
        run: npm run build
