name: Temporary Festival Runtime Currency Patch

on:
  push:
    branches:
      - agent/festival-runtime-currency

permissions:
  contents: write

jobs:
  patch-and-certify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Festival branch
        uses: actions/checkout@v4
        with:
          ref: agent/festival-runtime-currency
          fetch-depth: 0

      - name: Patch live Festival currency formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/features/festivals/runtime/FestivalLiveControlRoom.tsx")
          text = path.read_text()

          old_formatter = '''const money = (minor: number) =>
            new Intl.NumberFormat("en-GB", {
              style: "currency",
              currency: "GBP",
            }).format(minor / 100);'''
          new_formatter = '''const money = (minor: number, currencyCode: string) =>
            new Intl.NumberFormat("en-GB", {
              style: "currency",
              currency: currencyCode,
            }).format(minor / 100);'''

          old_usage = '''          value={money(
                    runtime.sales.foodAndDrinkMinor + runtime.sales.merchandiseMinor,
                  )}'''
          new_usage = '''          value={money(
                    runtime.sales.foodAndDrinkMinor + runtime.sales.merchandiseMinor,
                    runtime.currencyCode,
                  )}'''

          if old_formatter not in text:
              raise SystemExit("Expected hard-coded GBP formatter was not found")
          if old_usage not in text:
              raise SystemExit("Expected Festival sales money() call was not found")

          text = text.replace(old_formatter, new_formatter, 1)
          text = text.replace(old_usage, new_usage, 1)
          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run runtime currency regression
        run: npx vitest run src/features/festivals/runtime/runtimeCurrency.test.ts

      - name: Regenerate Festival inventory
        run: node scripts/festivals/certify-active-system.mjs

      - name: Commit finished patch and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/temp-festival-runtime-currency.yml
          git add src/features/festivals/runtime/FestivalLiveControlRoom.tsx docs/festivals/festival-active-callers.json
          git commit -m "Use edition currency in Festival runtime"
          git push origin HEAD:agent/festival-runtime-currency
