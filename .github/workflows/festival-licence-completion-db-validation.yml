name: Festival licence completion database validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: festival_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d festival_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Execute licence and manager contract
        run: >-
          psql postgresql://postgres:postgres@localhost:5432/festival_test
          -X -v ON_ERROR_STOP=1
          -f supabase/tests/festival_licence_completion_harness.sql
