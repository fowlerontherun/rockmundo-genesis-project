name: Luthiery Phase 3

on:
  pull_request:
    paths:
      - "src/components/crafting/**"
      - "src/data/luthieryWorkbench*"
      - "src/pages/CraftingWorkshop.tsx"
      - "src/pages/admin/LuthieryWorkbenchDemo.tsx"
      - "src/lib/luthieryWorkbenchDemoTestAccess.ts"
      - "src/App.tsx"
      - "tests/gig-experience/luthiery-workbench.spec.ts"
      - "playwright.config.ts"
      - "package.json"
      - "docs/crafting/LUTHIERY_CRAFTING_PLAN.md"
      - ".github/workflows/luthiery-phase3.yml"
  push:
    branches: [main]
    paths:
      - "src/components/crafting/**"
      - "src/data/luthieryWorkbench*"
      - "src/pages/CraftingWorkshop.tsx"
      - "src/pages/admin/LuthieryWorkbenchDemo.tsx"
      - "src/lib/luthieryWorkbenchDemoTestAccess.ts"
      - "tests/gig-experience/luthiery-workbench.spec.ts"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use repository npm version
        run: npm install --global npm@10.9.2
      - name: Verify dependency lock
        run: npm run verify:dependency-lock
      - name: Install dependencies
        run: npm ci
      - name: Focused Phase 3 tests
        run: npm run test:crafting:phase3
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint:ci
      - name: Build
        run: npm run build
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Phase 3 browser journey
        run: npm run test:crafting:phase3:e2e
      - name: Upload browser artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: luthiery-phase3-playwright
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
