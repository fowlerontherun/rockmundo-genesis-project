name: TOTP Phase 1-2 release gate

on:
  pull_request:
    paths:
      - "src/features/top-of-the-pops/**"
      - "src/pages/internal/TotpRenderSurface.tsx"
      - "workers/totp-render/**"
      - "supabase/functions/totp-render-worker-gateway/**"
      - "supabase/migrations/**"
      - "supabase/tests/totp_*.sql"
      - ".github/workflows/totp-*.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: TOTP unit, worker and migration gates
        run: npm run test:totp:release
      - name: Production build
        env:
          VITE_SUPABASE_URL: "https://yztogmdixmchsmimtent.supabase.co"
          VITE_SUPABASE_PUBLISHABLE_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inl6dG9nbWRpeG1jaHNtaW10ZW50Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTc5ODU0ODcsImV4cCI6MjA3MzU2MTQ4N30.vqfz_ZIvCIEXAuoSYmydg-XA6oUiPbcCc6yjfb2zL0g"
