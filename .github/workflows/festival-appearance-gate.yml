name: Festival Appearance Gate

on:
  pull_request:
    paths:
      - '.github/workflows/festival-appearance-gate.yml'
      - 'src/features/festivals/appearances/**'
      - 'src/hooks/useScheduledActivities.ts'
      - 'src/utils/bandActivityScheduling.ts'
      - 'src/components/schedule/DaySchedule.tsx'
      - 'src/pages/GigBooking.tsx'
      - 'src/mobile/hooks/useMobileDaySchedule.ts'
      - 'src/mobile/pages/MobileHome.tsx'
      - 'src/mobile/pages/MobileMe.tsx'
      - 'src/mobile/components/MobilePrimitives.tsx'
      - 'src/mobile/shell/MobileActivityBar.tsx'
      - 'supabase/migrations/20291220110000_member_festival_appearances.sql'
      - 'supabase/tests/band_festival_appearances_regression.sql'
  push:
    branches: [main]
    paths:
      - '.github/workflows/festival-appearance-gate.yml'
      - 'src/features/festivals/appearances/**'
      - 'src/hooks/useScheduledActivities.ts'
      - 'src/utils/bandActivityScheduling.ts'
      - 'src/components/schedule/DaySchedule.tsx'
      - 'src/pages/GigBooking.tsx'
      - 'src/mobile/hooks/useMobileDaySchedule.ts'
      - 'src/mobile/pages/MobileHome.tsx'
      - 'src/mobile/pages/MobileMe.tsx'
      - 'src/mobile/components/MobilePrimitives.tsx'
      - 'src/mobile/shell/MobileActivityBar.tsx'
      - 'supabase/migrations/20291220110000_member_festival_appearances.sql'
      - 'supabase/tests/band_festival_appearances_regression.sql'

jobs:
  verify-festival-appearances:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Match repository npm version
        run: npm install --global npm@10.9.2
      - name: Install locked dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Festival appearance unit and wiring tests
        run: npx vitest run src/features/festivals/appearances
      - name: Production bundle
        run: npm run build
